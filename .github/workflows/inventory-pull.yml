name: Inventory dashboard pull

# Runs the Shopify pull daily and commits data.json so Netlify redeploys.
# Cron is UTC and does not follow daylight saving:
#   '0 12 * * *' = 12:00 UTC = 8:00 AM EDT (summer) / 7:00 AM EST (winter).
# Adjust the hour here if you want a different ET time year-round.

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch: {}        # manual "Run workflow" button for the first run / on-demand

permissions:
  contents: write              # lets the job commit data.json back to the repo

concurrency:
  group: inventory-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'   # Node 18+ for global fetch; script uses only built-ins

      - name: Run inventory pull
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
        run: node scripts/pull-inventory.mjs

      - name: Commit data.json if changed
        run: |
          git config user.name "cardshq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cardshq/inventory-dashboard/data.json cardshq/inventory-dashboard/snapshots
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Inventory snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
