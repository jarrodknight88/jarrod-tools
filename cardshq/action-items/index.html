// ==================== STATE ====================
var STATE_KEY = 'chq-actions-global';
var OLD_KEY_PREFIX = 'chq-actions-';

function loadGlobalState(){
  try { var s = localStorage.getItem(STATE_KEY); return s ? JSON.parse(s) : null; } catch(e){ return null; }
}
function saveGlobalState(state){
  try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch(e){}
}

function migrateOldState(){
  var existing = loadGlobalState();
  if(existing) return existing;
  var globalState = {};
  Object.keys(MEETINGS).forEach(function(mid){
    var oldKey = OLD_KEY_PREFIX + mid;
    var raw;
    try { raw = localStorage.getItem(oldKey); } catch(e){}
    if(!raw) return;
    var oldState;
    try { oldState = JSON.parse(raw); } catch(e){ return; }
    var meeting = MEETINGS[mid];
    meeting.sections.forEach(function(sec){
      sec.i.forEach(function(item, i){
        var oldId = sec.g + '_' + i;
        if(oldState[oldId] && item.id){
          globalState[item.id] = true;
        }
      });
    });
  });
  saveGlobalState(globalState);
  return globalState;
}

var STATE = migrateOldState();
var currentView = 'landing';
var currentMeeting = null;
var showCompleted = true;

// ==================== TASK INDEX ====================
var TASK_INDEX = {};
Object.keys(MEETINGS).forEach(function(mid){
  var m = MEETINGS[mid];
  m.sections.forEach(function(sec){
    sec.i.forEach(function(item){
      TASK_INDEX[item.id] = { item: item, meetingId: mid, meetingLabel: m.label, sectionName: sec.g };
    });
  });
});

function getLinkGroup(taskId){
  var entry = TASK_INDEX[taskId];
  if(!entry) return [taskId];
  var linked = entry.item.linkedTo || [];
  var seen = {};
  seen[taskId] = true;
  linked.forEach(function(lid){ if(TASK_INDEX[lid]) seen[lid] = true; });
  return Object.keys(seen);
}

function isChecked(taskId){ return !!STATE[taskId]; }
function setChecked(taskId, value){
  if(value) STATE[taskId] = true;
  else delete STATE[taskId];
}

// ==================== STATS ====================
function getMeetingStats(mid){
  var meeting = MEETINGS[mid];
  var total = 0, done = 0, open_urgent = 0;
  meeting.sections.forEach(function(sec){
    sec.i.forEach(function(item){
      total++;
      if(isChecked(item.id)) done++;
      else if(item.c === 'urgent') open_urgent++;
    });
  });
  return { total:total, done:done, remaining:total-done, open_urgent:open_urgent };
}

function getAllStats(){
  var seen = {};
  var total = 0, done = 0;
  Object.keys(TASK_INDEX).forEach(function(tid){
    if(seen[tid]) return;
    var group = getLinkGroup(tid);
    group.forEach(function(g){ seen[g] = true; });
    total++;
    var anyDone = group.some(function(g){ return isChecked(g); });
    if(anyDone) done++;
  });
  return { total:total, done:done, remaining:total-done };
}

  if(currentView === 'landing'){
    topbarDate.textContent = 'All Meetings';
    renderLanding(app);
  } else {
    var m = MEETINGS[currentMeeting];
    topbarDate.textContent = m.label;
    renderMeeting(app, currentMeeting);
  }
}

function renderLanding(app){
  var stats = getAllStats();
  var pct = stats.total > 0 ? Math.round(stats.done/stats.total*100) : 0;

  var html = '';
  html += '<div class="stats-row">';
  html += '<div class="stat"><div class="stat-num">'+stats.remaining+'</div><div class="stat-label">open tasks</div></div>';
  html += '<div class="stat"><div class="stat-num done">'+stats.done+'</div><div class="stat-label">completed</div></div>';
  html += '<div class="stat"><div class="stat-num">'+pct+'%</div><div class="stat-label">overall progress</div></div>';
  html += '</div>';
  html += '<div class="progress-wrap"><div class="progress-fill" style="width:'+pct+'%"></div></div>';

  html += '<div class="view-label" style="margin-bottom:10px">Meetings</div>';
  html += '<div class="summary-grid">';

  Object.keys(MEETINGS).sort().reverse().forEach(function(mid){
    var m = MEETINGS[mid];
    var s = getMeetingStats(mid);
    var countHtml = s.remaining > 0
      ? '<span class="badge-count">'+s.remaining+' open</span>'
      : '<span class="badge-count ok">Complete</span>';
    html += '<div class="summary-card" data-mid="'+mid+'">';
    html += '<div class="summary-card-left"><h3>'+escapeHtml(m.label)+'</h3><p>'+s.total+' tasks &nbsp;|&nbsp; '+s.open_urgent+' urgent</p></div>';
    html += '<div class="summary-card-right">'+countHtml+'<span class="chevron">›</span></div>';
    html += '</div>';
  });

  html += '</div>';
  app.innerHTML = html;

  app.querySelectorAll('.summary-card').forEach(function(card){
    card.addEventListener('click', function(){
      currentMeeting = card.getAttribute('data-mid');
      currentView = 'meeting';
      render();
    });
  });
}

function renderMeeting(app, mid){
  var meeting = MEETINGS[mid];
  var stats = getMeetingStats(mid);
  var pct = stats.total > 0 ? Math.round(stats.done/stats.total*100) : 0;

  var html = '';
  html += '<button class="back-btn" id="back-btn">‹ All Meetings</button>';
  html += '<div class="stats-row">';
  html += '<div class="stat"><div class="stat-num">'+stats.remaining+'</div><div class="stat-label">remaining</div></div>';
  html += '<div class="stat"><div class="stat-num done">'+stats.done+'</div><div class="stat-label">completed</div></div>';
  html += '<div class="stat"><div class="stat-num">'+pct+'%</div><div class="stat-label">progress</div></div>';
  html += '</div>';
  html += '<div class="progress-wrap"><div class="progress-fill" style="width:'+pct+'%"></div></div>';

  html += '<div class="controls">';
  html += '<div class="view-btns">';
  html += '<button class="view-btn'+(showCompleted?'':' active')+'" id="btn-open">Open only</button>';
  html += '<button class="view-btn'+(showCompleted?' active':'')+'" id="btn-all">Show all</button>';
  html += '</div></div>';

  var anyVisible = false;
  meeting.sections.forEach(function(sec){
    var visibleItems = sec.i.filter(function(item){
      return showCompleted || !isChecked(item.id);
    });
    if(visibleItems.length === 0) return;
    anyVisible = true;

    html += '<div class="section">';
    html += '<div class="section-title">'+escapeHtml(sec.g)+'</div>';

    sec.i.forEach(function(item){
      var checked = isChecked(item.id);
      if(!showCompleted && checked) return;
      var linkedTo = item.linkedTo || [];
      var linkBadge = '';
      if(linkedTo.length > 0){
        var totalLinked = linkedTo.length + 1;
        linkBadge = '<span class="link-badge" title="Linked to '+linkedTo.length+' other task(s) across meetings">🔗 '+totalLinked+'</span>';
      }
      html += '<div class="item'+(checked?' checked':'')+'" data-tid="'+item.id+'">';
      html += '<div class="cb'+(checked?' on':'')+'"><svg width="11" height="8" viewBox="0 0 11 8" fill="none"><path d="M1 4L4 7L10 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
      html += '<div class="item-body"><div class="item-text">'+escapeHtml(item.t)+'</div>';
      html += '<div class="item-meta"><span class="badge '+item.c+'">'+escapeHtml(item.d)+'</span>'+linkBadge+'</div>';
      html += '</div></div>';
    });

    html += '</div>';
  });

  if(!anyVisible){
    html += '<div class="empty">All tasks complete in this meeting</div>';
  }

  app.innerHTML = html;

  document.getElementById('back-btn').addEventListener('click', function(){
    currentView = 'landing'; currentMeeting = null; render();
  });
  document.getElementById('btn-open').addEventListener('click', function(){ showCompleted = false; render(); });
  document.getElementById('btn-all').addEventListener('click', function(){ showCompleted = true; render(); });

  app.querySelectorAll('.item').forEach(function(row){
    row.addEventListener('click', function(){
      var tid = row.getAttribute('data-tid');
      handleTaskClick(tid);
    });
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

// ==================== TOGGLE + LINKED MODAL ====================
function handleTaskClick(tid){
  var entry = TASK_INDEX[tid];
  if(!entry) return;
  var currentlyChecked = isChecked(tid);
  var linkedTo = entry.item.linkedTo || [];

  if(currentlyChecked){
    setChecked(tid, false);
    saveGlobalState(STATE);
    render();
    return;
  }

  if(linkedTo.length === 0){
    setChecked(tid, true);
    saveGlobalState(STATE);
    render();
    return;
  }

  var openLinked = linkedTo.filter(function(lid){ return TASK_INDEX[lid] && !isChecked(lid); });
  if(openLinked.length === 0){
    setChecked(tid, true);
    saveGlobalState(STATE);
    render();
    return;
  }

  showLinkedModal(tid, openLinked);
}

function showLinkedModal(tid, openLinked){
  var modal = document.getElementById('link-modal');
  var taskList = document.getElementById('modal-task-list');
  var desc = document.getElementById('modal-desc');

  desc.textContent = 'This task is linked to ' + openLinked.length + ' other ' +
    (openLinked.length === 1 ? 'task' : 'tasks') +
    ' tracked in other meetings. Mark them all complete in one go, or just this one?';

  taskList.innerHTML = '';
  openLinked.forEach(function(lid){
    var lt = TASK_INDEX[lid];
    if(!lt) return;
    var div = document.createElement('div');
    div.className = 'modal-task-item';
    div.innerHTML = escapeHtml(lt.item.t) +
      '<span class="modal-task-meeting">' + escapeHtml(lt.meetingLabel) + '</span>';
    taskList.appendChild(div);
  });

  modal.classList.add('show');

  var justThisBtn = document.getElementById('modal-just-this');
  var markAllBtn = document.getElementById('modal-mark-all');

  function onJustThis(){
    setChecked(tid, true);
    saveGlobalState(STATE);
    cleanup();
    render();
  }
  function onMarkAll(){
    setChecked(tid, true);
    openLinked.forEach(function(lid){ setChecked(lid, true); });
    saveGlobalState(STATE);
    cleanup();
    render();
  }
  function onBackdrop(e){ if(e.target === modal){ cleanup(); } }
  function cleanup(){
    modal.classList.remove('show');
    justThisBtn.removeEventListener('click', onJustThis);
    markAllBtn.removeEventListener('click', onMarkAll);
    modal.removeEventListener('click', onBackdrop);
  }
  justThisBtn.addEventListener('click', onJustThis);
  markAllBtn.addEventListener('click', onMarkAll);
  modal.addEventListener('click', onBackdrop);
}

render();
</script>
</body>
</html>
