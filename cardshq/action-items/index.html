<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CardsHQ - Action Items</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F8FAFC;color:#111111;min-height:100vh}
.topbar{background:#111111;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between}
.topbar h1{font-size:16px;font-weight:600;color:#fff}
.topbar span{font-size:13px;color:#94A3B8}
.container{max-width:780px;margin:0 auto;padding:2rem 1rem}

/* Landing / overview */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.5rem}
.stat{background:#fff;border:0.5px solid #E2E8F0;border-radius:10px;padding:1rem;text-align:center}
.stat-num{font-size:26px;font-weight:600;color:#111}
.stat-num.done{color:#10B981}
.stat-label{font-size:12px;color:#64748B;margin-top:3px}
.progress-wrap{background:#E2E8F0;border-radius:4px;height:5px;margin-bottom:1.5rem;overflow:hidden}
.progress-fill{height:100%;background:#10B981;border-radius:4px;transition:width 0.3s}

/* Controls */
.controls{display:flex;gap:10px;margin-bottom:1.25rem;align-items:center;flex-wrap:wrap}
.view-btns{display:flex;gap:6px}
.view-btn{padding:6px 14px;border-radius:6px;border:0.5px solid #E2E8F0;background:#fff;font-size:13px;cursor:pointer;color:#475569;font-family:inherit;transition:all 0.1s}
.view-btn.active{background:#111111;color:#fff;border-color:#111111}
.date-select{padding:6px 12px;border-radius:6px;border:0.5px solid #E2E8F0;background:#fff;font-size:13px;color:#111;font-family:inherit;cursor:pointer;margin-left:auto}

/* Open items summary cards */
.summary-grid{display:grid;gap:8px;margin-bottom:1.5rem}
.summary-card{background:#fff;border:0.5px solid #E2E8F0;border-radius:10px;padding:1rem 1.25rem;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:background 0.1s}
.summary-card:hover{background:#F8FAFC}
.summary-card-left h3{font-size:14px;font-weight:500;color:#111}
.summary-card-left p{font-size:12px;color:#64748B;margin-top:2px}
.summary-card-right{display:flex;align-items:center;gap:10px}
.badge-count{background:#FEE2E2;color:#991B1B;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px}
.badge-count.ok{background:#D1FAE5;color:#065F46}
.chevron{color:#94A3B8;font-size:16px}

/* Section / checklist view */
.section{background:#fff;border:0.5px solid #E2E8F0;border-radius:12px;margin-bottom:10px;overflow:hidden}
.section-title{font-size:11px;font-weight:600;color:#64748B;text-transform:uppercase;letter-spacing:0.06em;padding:11px 16px 9px;border-bottom:0.5px solid #F1F5F9;background:#F8FAFC}
.item{display:flex;align-items:flex-start;gap:12px;padding:10px 16px;border-bottom:0.5px solid #F1F5F9;cursor:pointer;transition:background 0.1s}
.item:last-child{border-bottom:none}
.item:hover{background:#F8FAFC}
.item.checked{opacity:0.42}
.item.checked .item-text{text-decoration:line-through;color:#94A3B8}
.cb{width:19px;height:19px;min-width:19px;border-radius:5px;border:1.5px solid #CBD5E1;display:flex;align-items:center;justify-content:center;margin-top:1px;background:#fff;transition:all 0.15s}
.cb.on{background:#10B981;border-color:#10B981}
.cb svg{display:none}
.cb.on svg{display:block}
.item-body{flex:1}
.item-text{font-size:13.5px;color:#111;line-height:1.5}
.badge{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;margin-top:4px}
.urgent{background:#FEE2E2;color:#991B1B}
.soon{background:#FEF3C7;color:#92400E}
.ongoing{background:#F1F5F9;color:#475569}

/* Empty state */
.empty{text-align:center;padding:3rem 1rem;color:#94A3B8;font-size:14px}

.footer{text-align:center;font-size:12px;color:#94A3B8;margin-top:2rem;padding-bottom:2rem}
.back-btn{background:none;border:none;color:#3B82F6;font-size:13px;cursor:pointer;font-family:inherit;padding:0;margin-bottom:1rem;display:flex;align-items:center;gap:4px}
.back-btn:hover{text-decoration:underline}
.view-label{font-size:13px;color:#64748B;font-weight:500}
</style>
</head>
<body>
<div class="topbar">
  <h1>CardsHQ - Action Items</h1>
  <span id="topbar-date">All Meetings</span>
</div>
<div class="container">
  <div id="app"></div>
  <div class="footer">CardsHQ Ecommerce &nbsp;|&nbsp; Jarrod Knight</div>
</div>

<script>
// ── DATA
var MEETINGS = {
  "may-12-2026": {
    label: "Kelly Touchbase - May 12, 2026",
    sections: [
      {g:"Smile.io - Loyalty Setup",i:[
        {t:"Confirm Smile.io staging environment configured correctly - Hollow 1pt, Rare 2pt, Grail 2pt",d:"This week",c:"urgent"},
        {t:"Manually recreate all staging configurations on production - no export/import available, must be done manually",d:"By June 1",c:"soon"},
        {t:"Get API keys from Smile developer tools for Nathaniel's headless integration",d:"This week",c:"urgent"},
        {t:"Confirm retroactive points import process with Smile team - finalize closer to June 1",d:"By June 1",c:"soon"},
      ]},
      {g:"Loyalty - Marketing & Launch",i:[
        {t:"Draft Terms & Conditions page for loyalty program",d:"Before June 16",c:"soon"},
        {t:"Draft customer-facing FAQ - how tiers, points, and rewards work",d:"Before June 16",c:"soon"},
        {t:"Build visual customer-facing explanation of the loyalty program structure",d:"Before June 16",c:"soon"},
        {t:"Confirm launch messaging plan for June 16 (Summer Virtual) vs July Detroit - must not overlap",d:"This week",c:"urgent"},
        {t:"Confirm brand guidelines for loyalty graphics with Dizzy / Steven Polizzi",d:"This week",c:"urgent"},
        {t:"Follow up with Dizzy on PassKit loyalty card template - delivery target next week",d:"Next week",c:"soon"},
      ]},
      {g:"Loyalty - Technical",i:[
        {t:"Get Carter review on B2B exclusion list - 325 tax-exempt customers at $6M YTD spend need proper tagging before launch",d:"This week",c:"urgent"},
        {t:"Confirm Mailchimp sync flows with Nathaniel - tier upgrades, points earned/redeemed, birthday campaigns",d:"By June 1",c:"soon"},
        {t:"Get enterprise pricing from Gorgias for AI chat agent - $0.90/convo too expensive at standard tier",d:"This week",c:"soon"},
        {t:"Confirm Nathaniel's Slabber vs loyalty time split - ensure June 1 dev completion stays on track",d:"This week",c:"urgent"},
        {t:"Clarify sequencing: loyalty launch vs PDP redesign - confirm with Kelly and Carter",d:"This week",c:"urgent"},
      ]},
      {g:"Jira & Dev Workflow",i:[
        {t:"Send epic breakdown document to Nathaniel",d:"This week",c:"urgent"},
        {t:"Nathaniel to set up staging environment using Matrixify - both staging and production configured",d:"This week",c:"urgent"},
        {t:"Schedule meeting with James to understand existing PM processes and align on unified approach",d:"This week",c:"soon"},
        {t:"Increase check-in cadence with Nathaniel to Monday/Wednesday 15-minute standups",d:"This week",c:"soon"},
        {t:"Add Gantt chart at epic level for overlapping initiative visibility - Kelly needs high-level view",d:"This week",c:"soon"},
      ]},
      {g:"Gorgias",i:[
        {t:"Test Gorgias website chat widget on staging environment before go-live",d:"Before May 1",c:"urgent"},
        {t:"Confirm DNS settings are in place - Geoff to complete when back next week",d:"Next week",c:"soon"},
        {t:"Communicate email change to team - outbound shifting from donotreply@cardshq.com to help@cardshq.com",d:"Before go-live",c:"soon"},
      ]},
      {g:"Swedish Rounding",i:[
        {t:"Work with Nathaniel on custom Swedish rounding solution - Georgia law requires round up if closer to 5, down if closer to lower number",d:"This week",c:"urgent"},
      ]},
      {g:"Segment Analytics",i:[
        {t:"Play around with Tresl platform - assess recommendation segments gap before deciding",d:"This week",c:"urgent"},
        {t:"Schedule Predflow call - invite Kelly + Nick",d:"This week",c:"urgent"},
        {t:"Brief Nick on both vendor calls before scheduling",d:"Before calls",c:"urgent"},
      ]},
      {g:"Loyalty - Stakeholder Feedback",i:[
        {t:"Send Tyler Nethercott email response - share with Kelly for review before sending",d:"This week",c:"urgent"},
        {t:"Draft response to James Sowder feedback items",d:"This week",c:"soon"},
        {t:"Model 2% buyback at Expert tier ($5K+) and above - cost per tier",d:"This week",c:"soon"},
        {t:"Define First Right of Refusal process for multiple 1 of 1 customers wanting the same card",d:"This week",c:"soon"},
        {t:"Resend Google feedback form to retail team for updated customer loyalty input",d:"This week",c:"soon"},
        {t:"Get Dean's feedback on loyalty perks",d:"Before next loyalty session",c:"ongoing"},
        {t:"Get Jimmy's take on David Adams loyalty program - what would CardsHQ need to do to beat it?",d:"Before next loyalty session",c:"ongoing"},
      ]},
      {g:"Trade Shows",i:[
        {t:"Come back with prioritized recommendation on 1 event from eTail Boston, ShopTalk Fall, Walmart Seller Summit - with reasoning on why the other two were not chosen",d:"Within 2 weeks",c:"soon"},
      ]},
      {g:"Sale to Deals + Nav",i:[
        {t:"Build Deals nav on staging - red/bold treatment, TCG + Sports sub-categories, Merch moved off L1",d:"This week",c:"urgent"},
        {t:"Check whether red Deals nav item conflicts visually with the green CardsHQ gift card",d:"This week",c:"urgent"},
      ]},
    ]
  }
};

var KEY_PREFIX = 'chq-actions-';
var currentView = 'landing'; // 'landing' | 'meeting'
var currentMeeting = null;
var showCompleted = true;

function stateKey(meetingId){ return KEY_PREFIX + meetingId; }
function loadState(mid){ try{ var s=localStorage.getItem(stateKey(mid)); return s?JSON.parse(s):{}; }catch(e){ return {}; } }
function saveState(mid, state){ try{ localStorage.setItem(stateKey(mid), JSON.stringify(state)); }catch(e){} }

function getMeetingStats(mid){
  var meeting = MEETINGS[mid];
  var state = loadState(mid);
  var total = 0, done = 0, open_urgent = 0;
  meeting.sections.forEach(function(sec){
    sec.i.forEach(function(item, i){
      var id = sec.g+'_'+i;
      total++;
      if(state[id]) done++;
      else if(item.c === 'urgent') open_urgent++;
    });
  });
  return {total:total, done:done, remaining:total-done, open_urgent:open_urgent};
}

function getAllStats(){
  var total=0, done=0, remaining=0;
  Object.keys(MEETINGS).forEach(function(mid){
    var s = getMeetingStats(mid);
    total += s.total; done += s.done; remaining += s.remaining;
  });
  return {total:total, done:done, remaining:remaining};
}

function render(){
  var app = document.getElementById('app');
  var topbarDate = document.getElementById('topbar-date');

  if(currentView === 'landing'){
    topbarDate.textContent = 'All Meetings';
    renderLanding(app);
  } else {
    var m = MEETINGS[currentMeeting];
    topbarDate.textContent = m.label;
    renderMeeting(app, currentMeeting);
  }
}

function renderLanding(app){
  var stats = getAllStats();
  var pct = stats.total > 0 ? Math.round(stats.done/stats.total*100) : 0;

  var html = '';
  // Stats
  html += '<div class="stats-row">';
  html += '<div class="stat"><div class="stat-num">'+stats.remaining+'</div><div class="stat-label">open tasks</div></div>';
  html += '<div class="stat"><div class="stat-num done">'+stats.done+'</div><div class="stat-label">completed</div></div>';
  html += '<div class="stat"><div class="stat-num">'+pct+'%</div><div class="stat-label">overall progress</div></div>';
  html += '</div>';
  html += '<div class="progress-wrap"><div class="progress-fill" style="width:'+pct+'%"></div></div>';

  // Open tasks this week summary
  html += '<div class="view-label" style="margin-bottom:10px">Meetings</div>';
  html += '<div class="summary-grid">';

  Object.keys(MEETINGS).sort().reverse().forEach(function(mid){
    var m = MEETINGS[mid];
    var s = getMeetingStats(mid);
    var countHtml = s.remaining > 0
      ? '<span class="badge-count">'+s.remaining+' open</span>'
      : '<span class="badge-count ok">Complete</span>';
    html += '<div class="summary-card" data-mid="'+mid+'">';
    html += '<div class="summary-card-left"><h3>'+m.label+'</h3><p>'+s.total+' tasks &nbsp;|&nbsp; '+s.open_urgent+' urgent</p></div>';
    html += '<div class="summary-card-right">'+countHtml+'<span class="chevron">›</span></div>';
    html += '</div>';
  });

  html += '</div>';
  app.innerHTML = html;

  // Bind clicks
  app.querySelectorAll('.summary-card').forEach(function(card){
    card.addEventListener('click', function(){
      currentMeeting = card.getAttribute('data-mid');
      currentView = 'meeting';
      render();
    });
  });
}

function renderMeeting(app, mid){
  var meeting = MEETINGS[mid];
  var state = loadState(mid);
  var stats = getMeetingStats(mid);
  var pct = stats.total > 0 ? Math.round(stats.done/stats.total*100) : 0;

  var html = '';

  // Back button
  html += '<button class="back-btn" id="back-btn">‹ All Meetings</button>';

  // Stats
  html += '<div class="stats-row">';
  html += '<div class="stat"><div class="stat-num">'+stats.remaining+'</div><div class="stat-label">remaining</div></div>';
  html += '<div class="stat"><div class="stat-num done">'+stats.done+'</div><div class="stat-label">completed</div></div>';
  html += '<div class="stat"><div class="stat-num">'+pct+'%</div><div class="stat-label">progress</div></div>';
  html += '</div>';
  html += '<div class="progress-wrap"><div class="progress-fill" style="width:'+pct+'%"></div></div>';

  // Controls
  html += '<div class="controls">';
  html += '<div class="view-btns">';
  html += '<button class="view-btn'+(showCompleted?'':' active')+'" id="btn-open">Open only</button>';
  html += '<button class="view-btn'+(showCompleted?' active':'')+'" id="btn-all">Show all</button>';
  html += '</div></div>';

  // Sections
  meeting.sections.forEach(function(sec, si){
    var visibleItems = sec.i.filter(function(item, i){
      var id = sec.g+'_'+i;
      return showCompleted || !state[id];
    });
    if(visibleItems.length === 0) return;

    html += '<div class="section">';
    html += '<div class="section-title">'+sec.g+'</div>';

    sec.i.forEach(function(item, i){
      var id = sec.g+'_'+i;
      var checked = !!state[id];
      if(!showCompleted && checked) return;
      html += '<div class="item'+(checked?' checked':'')+'" data-id="'+id+'" data-mid="'+mid+'">';
      html += '<div class="cb'+(checked?' on':'')+'"><svg width="11" height="8" viewBox="0 0 11 8" fill="none"><path d="M1 4L4 7L10 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
      html += '<div class="item-body"><div class="item-text">'+item.t+'</div><span class="badge '+item.c+'">'+item.d+'</span></div>';
      html += '</div>';
    });

    html += '</div>';
  });

  if(html.indexOf('class="item') === -1){
    html += '<div class="empty">All tasks complete! 🎉</div>';
  }

  app.innerHTML = html;

  // Back
  document.getElementById('back-btn').addEventListener('click', function(){
    currentView = 'landing'; currentMeeting = null; render();
  });

  // Toggle
  document.getElementById('btn-open').addEventListener('click', function(){
    showCompleted = false; render();
  });
  document.getElementById('btn-all').addEventListener('click', function(){
    showCompleted = true; render();
  });

  // Checkboxes
  app.querySelectorAll('.item').forEach(function(row){
    row.addEventListener('click', function(){
      var id = row.getAttribute('data-id');
      var mid2 = row.getAttribute('data-mid');
      var st = loadState(mid2);
      st[id] = !st[id];
      saveState(mid2, st);
      render();
    });
  });
}

// Init
render();
</script>
</body>
</html>
