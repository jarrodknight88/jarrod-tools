<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CardsHQ Supplies Audit</title>
<style>
  :root{
    --black:#111111;
    --blue:#3B82F6;
    --teal:#10B981;
    --amber:#D97706;
    --red:#EF4444;
    --ink:#111827;
    --muted:#6B7280;
    --faint:#9CA3AF;
    --line:#D1D5DB;
    --line-soft:#E5E7EB;
    --callout:#F9FAFB;
    --page:#F3F4F6;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--page);color:var(--ink);-webkit-font-smoothing:antialiased;}
  #root{max-width:1280px;margin:0 auto;padding:0 20px 64px;}

  /* Banner */
  .banner{background:var(--black);color:#fff;border-radius:0 0 16px 16px;margin:0 -20px 24px;padding:26px 28px 24px;}
  .banner-inner{max-width:1280px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;}
  .brand-row{display:flex;align-items:center;gap:14px;}
  .logo-img{height:28px;width:auto;display:block;}
  .brand-divider{width:1px;height:34px;background:rgba(255,255,255,0.22);flex:none;}
  .brand-name{font-size:22px;font-weight:bold;letter-spacing:-0.4px;line-height:1.05;}
  .brand-sub{font-size:12.5px;color:#9CA3AF;margin-top:3px;}
  .banner-right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
  .snapshot-date{font-size:15px;font-weight:bold;}
  .timestamp{font-size:12.5px;color:#9CA3AF;}

  /* Summary cards */
  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
  .s-card{background:var(--card);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line-soft);box-shadow:0 1px 2px rgba(17,17,17,0.04);}
  .s-card .label{font-size:11px;font-weight:bold;letter-spacing:0.9px;text-transform:uppercase;color:var(--muted);}
  .s-card .value{font-size:38px;font-weight:bold;letter-spacing:-1.6px;line-height:1;}
  .s-card .sub{font-size:12px;color:var(--faint);}
  .accent-bar{height:3px;border-radius:2px;width:34px;}
  .c-red   { color:#991B1B; }
  .c-amber { color:#92400E; }
  .c-green { color:#065F46; }
  .c-blue  { color:#1D4ED8; }
  .bar-red   { background:#EF4444; }
  .bar-amber { background:#F59E0B; }
  .bar-green { background:#10B981; }
  .bar-blue  { background:#3B82F6; }

  /* Controls row */
  .controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  .controls-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .section-title{font-size:19px;font-weight:bold;letter-spacing:-0.4px;margin:0;}

  /* Search */
  .search-wrap{position:relative;}
  .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none;}
  .search-input{
    font-family:inherit;font-size:13px;padding:8px 12px 8px 32px;
    border:1.5px solid var(--line);border-radius:9px;outline:none;color:var(--ink);
    width:220px;transition:border-color .14s ease;
  }
  .search-input:focus{border-color:var(--blue);}

  /* Flag filter chips */
  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{
    font-family:inherit;font-size:12.5px;font-weight:bold;
    padding:6px 14px;border-radius:999px;cursor:pointer;
    border:1.5px solid var(--line);background:#fff;color:var(--muted);
    transition:all .12s ease;display:flex;align-items:center;gap:6px;
  }
  .chip:hover{border-color:#9CA3AF;}
  .chip.on{background:var(--black);border-color:var(--black);color:#fff;}
  .chip-dot{width:8px;height:8px;border-radius:50%;flex:none;}

  /* Table */
  .table-wrap{background:var(--card);border-radius:14px;border:1px solid var(--line-soft);box-shadow:0 1px 2px rgba(17,17,17,0.04);overflow:hidden;}
  .table-head{display:grid;grid-template-columns:2fr 1.2fr 0.8fr 0.9fr 0.9fr 1fr 0.9fr;gap:0;background:var(--black);padding:0;}
  .th{font-size:11px;font-weight:bold;letter-spacing:0.9px;text-transform:uppercase;color:#9CA3AF;padding:12px 14px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:5px;}
  .th:hover{color:#E5E7EB;}
  .th.sorted{color:#fff;}
  .sort-arrow{font-size:10px;opacity:0.7;}

  .table-body{max-height:620px;overflow-y:auto;}
  .table-body::-webkit-scrollbar{width:5px;}
  .table-body::-webkit-scrollbar-track{background:transparent;}
  .table-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px;}

  .row{display:grid;grid-template-columns:2fr 1.2fr 0.8fr 0.9fr 0.9fr 1fr 0.9fr;border-bottom:1px solid var(--line-soft);transition:background .1s ease;}
  .row:last-child{border-bottom:none;}
  .row:hover{background:#F8FAFC;}
  .td{font-size:13px;padding:11px 14px;display:flex;align-items:center;color:var(--ink);overflow:hidden;}
  .td-product{flex-direction:column;align-items:flex-start;gap:2px;}
  .td-product .name{font-weight:bold;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;}
  .td-product .variant{font-size:11.5px;color:var(--muted);}
  .td-num{font-size:13px;font-weight:bold;font-variant-numeric:tabular-nums;}
  .td-num.neg{color:#991B1B;}
  .td-num.zero{color:#B45309;}
  .td-num.low{color:#92400E;}
  .td-num.ok{color:#065F46;}

  /* Flag badge */
  .flag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:bold;letter-spacing:0.5px;padding:3px 9px;border-radius:999px;}
  .flag-negative{background:#FEE2E2;color:#991B1B;}
  .flag-sold_out{background:#FEF3C7;color:#B45309;}
  .flag-low     {background:#FEF9C3;color:#92400E;}
  .flag-healthy {background:#DCFCE7;color:#065F46;}

  /* Empty state */
  .empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:14px;}

  /* Result count */
  .result-count{font-size:12.5px;color:var(--muted);padding:10px 14px;border-top:1px solid var(--line-soft);background:var(--callout);}

  /* Pagination */
  .pagination{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-top:1px solid var(--line-soft);background:var(--callout);}
  .page-info{font-size:12.5px;color:var(--muted);}
  .page-btns{display:flex;gap:6px;}
  .page-btn{
    font-family:inherit;font-size:12.5px;font-weight:bold;
    padding:5px 13px;border-radius:8px;cursor:pointer;
    border:1.5px solid var(--line);background:#fff;color:var(--ink);
    transition:all .12s ease;
  }
  .page-btn:hover:not(:disabled){border-color:#9CA3AF;}
  .page-btn:disabled{opacity:0.4;cursor:default;}

  .footnote{font-size:12px;color:var(--faint);text-align:center;margin-top:24px;}

  @media(max-width:860px){
    .summary{grid-template-columns:repeat(2,1fr);}
    .table-head,.row{grid-template-columns:2fr 0.8fr 0.8fr 0.9fr;}
    .th:nth-child(n+5),.td:nth-child(n+5){display:none;}
    .search-input{width:160px;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const {useState, useEffect, useMemo, useCallback} = React;
const PAGE_SIZE = 50;

const FLAG_META = {
  negative: { label:'Negative', dot:'#EF4444', chip:'Negative Inventory' },
  sold_out: { label:'Sold Out', dot:'#F59E0B', chip:'Sold Out' },
  low:      { label:'Low Stock', dot:'#D97706', chip:'Low (1-10)' },
  healthy:  { label:'Healthy', dot:'#10B981', chip:'Healthy' },
};

const FLAG_ORDER = ['negative','sold_out','low','healthy'];

function Banner({ date, stamp }) {
  return (
    <div className="banner">
      <div className="banner-inner">
        <div className="brand-row">
          <img className="logo-img" src="./assets/logo.png" alt="CardsHQ" onError={e=>e.target.style.display='none'}/>
          <div className="brand-divider"/>
          <div>
            <div className="brand-name">Supplies Audit</div>
            <div className="brand-sub">Inventory · Vendor · Last Sold</div>
          </div>
        </div>
        <div className="banner-right">
          <div className="snapshot-date">{date}</div>
          <div className="timestamp">{stamp}</div>
        </div>
      </div>
    </div>
  );
}

function SummaryCards({ records }) {
  const counts = useMemo(() => {
    const c = { negative:0, sold_out:0, low:0, healthy:0 };
    records.forEach(r => c[r.flag] = (c[r.flag]||0) + 1);
    return c;
  }, [records]);

  const cards = [
    { key:'negative', label:'Negative Inventory', color:'c-red',   bar:'bar-red',   sub:'Reconcile now' },
    { key:'sold_out', label:'Sold Out',           color:'c-amber', bar:'bar-amber', sub:'Set to draft + reorder' },
    { key:'low',      label:'Low Stock (1-10)',   color:'c-amber', bar:'bar-amber', sub:'Reorder soon' },
    { key:'healthy',  label:'Healthy',            color:'c-green', bar:'bar-green', sub:'No action needed' },
  ];

  return (
    <div className="summary">
      {cards.map(c => (
        <div className="s-card" key={c.key}>
          <div className={'accent-bar '+c.bar}/>
          <div className="label">{c.label}</div>
          <div className={'value '+c.color}>{counts[c.key] || 0}</div>
          <div className="sub">{c.sub}</div>
        </div>
      ))}
    </div>
  );
}

function FlagBadge({ flag }) {
  const m = FLAG_META[flag] || {};
  return <span className={'flag flag-'+flag}><span style={{width:6,height:6,borderRadius:'50%',background:m.dot,display:'inline-block'}}></span>{m.label}</span>;
}

function invClass(inv) {
  if (inv < 0)   return 'neg';
  if (inv === 0) return 'zero';
  if (inv <= 10) return 'low';
  return 'ok';
}

function App() {
  const [allRecords, setAllRecords] = useState(null);
  const [dateLabel, setDateLabel]   = useState('June 24, 2026');
  const [stamp, setStamp]           = useState('Pulled from Mipler · June 24, 2026');
  const [search, setSearch]   = useState('');
  const [activeFlags, setActiveFlags] = useState(new Set());
  const [sortKey, setSortKey] = useState('inventory');
  const [sortDir, setSortDir] = useState('asc');
  const [page, setPage]       = useState(0);

  useEffect(() => {
    fetch('./data.json', { cache:'no-store' })
      .then(r => r.json())
      .then(d => {
        setAllRecords(d.records || []);
        if (d.date) setDateLabel(new Date(d.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'long',day:'numeric',year:'numeric'}));
        if (d.generatedAt) setStamp('Pulled from Mipler · ' + new Date(d.generatedAt).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}));
      })
      .catch(() => setAllRecords([]));
  }, []);

  const toggleFlag = useCallback(flag => {
    setActiveFlags(prev => {
      const next = new Set(prev);
      next.has(flag) ? next.delete(flag) : next.add(flag);
      return next;
    });
    setPage(0);
  }, []);

  const handleSort = useCallback(key => {
    setSortKey(prev => {
      if (prev === key) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
      else { setSortDir('asc'); }
      return key;
    });
    setPage(0);
  }, []);

  const filtered = useMemo(() => {
    if (!allRecords) return [];
    let rows = allRecords;
    if (activeFlags.size > 0) rows = rows.filter(r => activeFlags.has(r.flag));
    if (search.trim()) {
      const q = search.toLowerCase();
      rows = rows.filter(r => r.product.toLowerCase().includes(q) || r.variant.toLowerCase().includes(q) || r.sku.toLowerCase().includes(q));
    }
    rows = [...rows].sort((a, b) => {
      let av = a[sortKey], bv = b[sortKey];
      if (sortKey === 'inventory' || sortKey === 'sold_ytd') { av = Number(av); bv = Number(bv); }
      else if (sortKey === 'flag') { av = FLAG_ORDER.indexOf(av); bv = FLAG_ORDER.indexOf(bv); }
      else { av = String(av||'').toLowerCase(); bv = String(bv||'').toLowerCase(); }
      if (av < bv) return sortDir === 'asc' ? -1 : 1;
      if (av > bv) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });
    return rows;
  }, [allRecords, activeFlags, search, sortKey, sortDir]);

  const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
  const pageRows   = filtered.slice(page * PAGE_SIZE, (page+1) * PAGE_SIZE);

  const SortTh = ({ k, label }) => (
    <div className={'th'+(sortKey===k?' sorted':'')} onClick={() => handleSort(k)}>
      {label}
      <span className="sort-arrow">{sortKey===k ? (sortDir==='asc'?'▲':'▼') : '⇅'}</span>
    </div>
  );

  if (!allRecords) return <div style={{padding:'80px 20px',textAlign:'center',color:'#6B7280',fontFamily:'Arial'}}>Loading supplies data…</div>;

  return (
    <React.Fragment>
      <Banner date={dateLabel} stamp={stamp}/>
      <SummaryCards records={allRecords}/>

      <div className="controls">
        <div className="controls-left">
          <h2 className="section-title">All Supplies</h2>
          <div className="chips">
            {FLAG_ORDER.map(f => {
              const on = activeFlags.has(f);
              return (
                <button key={f} className={'chip'+(on?' on':'')} onClick={() => toggleFlag(f)}>
                  {!on && <span className="chip-dot" style={{background: FLAG_META[f].dot}}/>}
                  {FLAG_META[f].chip}
                </button>
              );
            })}
          </div>
        </div>
        <div className="search-wrap">
          <span className="search-icon">🔍</span>
          <input
            className="search-input"
            placeholder="Search product or SKU…"
            value={search}
            onChange={e => { setSearch(e.target.value); setPage(0); }}
          />
        </div>
      </div>

      <div className="table-wrap">
        <div className="table-head">
          <SortTh k="product"    label="Product"/>
          <SortTh k="flag"       label="Flag"/>
          <SortTh k="inventory"  label="Inventory"/>
          <SortTh k="sold_ytd"   label="Sold YTD"/>
          <SortTh k="last_sold"  label="Last Sold"/>
          <SortTh k="vendor"     label="Vendor"/>
          <SortTh k="status"     label="Status"/>
        </div>
        <div className="table-body">
          {pageRows.length === 0
            ? <div className="empty">No results match your filters.</div>
            : pageRows.map((r, i) => (
              <div className="row" key={i}>
                <div className="td td-product">
                  <span className="name" title={r.product}>{r.product}</span>
                  {r.variant && r.variant !== 'Default Title' && <span className="variant">{r.variant}</span>}
                </div>
                <div className="td"><FlagBadge flag={r.flag}/></div>
                <div className={'td td-num '+invClass(r.inventory)}>{r.inventory}</div>
                <div className="td td-num" style={{color:'#374151'}}>{r.sold_ytd.toLocaleString()}</div>
                <div className="td" style={{fontSize:'12.5px',color:r.last_sold?'var(--ink)':'var(--faint)'}}>{r.last_sold || 'Never sold'}</div>
                <div className="td" style={{fontSize:'12.5px',color:'var(--muted)'}}>{r.vendor}</div>
                <div className="td" style={{fontSize:'12px',color:'var(--muted)',textTransform:'capitalize'}}>{r.status}</div>
              </div>
            ))
          }
        </div>
        <div className="pagination">
          <span className="page-info">{filtered.length.toLocaleString()} results · page {page+1} of {Math.max(1,totalPages)}</span>
          <div className="page-btns">
            <button className="page-btn" disabled={page===0} onClick={()=>setPage(p=>p-1)}>← Prev</button>
            <button className="page-btn" disabled={page>=totalPages-1} onClick={()=>setPage(p=>p+1)}>Next →</button>
          </div>
        </div>
      </div>

      <div className="footnote">CardsHQ · Supplies Audit · Source: Mipler · {dateLabel} · {allRecords.length.toLocaleString()} total variants</div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
