<style>
:root{--black:#111111;--blue:#3B82F6;--teal:#10B981;--amber:#D97706;--ink:#111827;--muted:#6B7280;--faint:#9CA3AF;--line:#D1D5DB;--line-soft:#E5E7EB;--callout:#F9FAFB;--page:#F3F4F6;--card:#FFFFFF;}
*{box-sizing:border-box;}html,body{margin:0;padding:0;}
body{font-family:Arial,Helvetica,sans-serif;background:var(--page);color:var(--ink);-webkit-font-smoothing:antialiased;}
#root{max-width:1280px;margin:0 auto;padding:0 20px 64px;}
.banner{background:var(--black);color:#fff;border-radius:0 0 16px 16px;margin:0 -20px 28px;padding:26px 28px 24px;}
.banner-inner{max-width:1280px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;}
.brand-row{display:flex;align-items:center;gap:14px;}
.brand-divider{width:1px;height:34px;background:rgba(255,255,255,0.22);flex:none;}
.brand-name{font-size:22px;font-weight:bold;letter-spacing:-0.4px;line-height:1.05;}
.brand-sub{font-size:12.5px;color:#9CA3AF;margin-top:3px;}
.banner-right{text-align:right;}
.snapshot-date{font-size:15px;font-weight:bold;color:#fff;}
.timestamp{font-size:12.5px;color:#9CA3AF;margin-top:4px;}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
.s-card{background:var(--card);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line-soft);box-shadow:0 1px 2px rgba(17,17,17,0.04);}
.s-card .label{font-size:11px;font-weight:bold;letter-spacing:0.9px;text-transform:uppercase;color:var(--muted);}
.s-card .value{font-size:38px;font-weight:bold;letter-spacing:-1.6px;line-height:1;}
.s-card .sub{font-size:12px;color:var(--faint);}
.accent-bar{height:3px;border-radius:2px;width:34px;margin-bottom:2px;}
.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.controls-left{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.section-title{font-size:19px;font-weight:bold;letter-spacing:-0.4px;margin:0;}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{font-family:inherit;font-size:12.5px;font-weight:bold;padding:6px 14px;border-radius:999px;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--muted);transition:all .12s ease;display:flex;align-items:center;gap:6px;}
.chip:hover{border-color:#9CA3AF;}.chip.on{background:var(--black);border-color:var(--black);color:#fff;}
.chip-dot{width:8px;height:8px;border-radius:50%;flex:none;}
.search-wrap{position:relative;}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none;}
.search-input{font-family:inherit;font-size:13px;padding:8px 12px 8px 32px;border:1.5px solid var(--line);border-radius:9px;outline:none;color:var(--ink);width:220px;transition:border-color .14s ease;}
.search-input:focus{border-color:var(--blue);}
.table-wrap{background:var(--card);border-radius:14px;border:1px solid var(--line-soft);box-shadow:0 1px 2px rgba(17,17,17,0.04);overflow:hidden;}
.table-head{display:grid;grid-template-columns:2.2fr 1.1fr 0.75fr 0.85fr 1.05fr 0.8fr 0.85fr;background:var(--black);}
.th{font-size:11px;font-weight:bold;letter-spacing:0.9px;text-transform:uppercase;color:#9CA3AF;padding:12px 14px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:5px;}
.th:hover{color:#E5E7EB;}.th.sorted{color:#fff;}
.sort-arrow{font-size:10px;}
.table-body{max-height:600px;overflow-y:auto;}
.table-body::-webkit-scrollbar{width:5px;}
.table-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px;}
.row{display:grid;grid-template-columns:2.2fr 1.1fr 0.75fr 0.85fr 1.05fr 0.8fr 0.85fr;border-bottom:1px solid var(--line-soft);}
.row:last-child{border-bottom:none;}.row:hover{background:#F8FAFC;}
.td{font-size:13px;padding:10px 14px;display:flex;align-items:center;overflow:hidden;}
.td-product{flex-direction:column;align-items:flex-start;gap:2px;}
.pname{font-weight:bold;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;}
.pvariant{font-size:11.5px;color:var(--muted);}
.td-num{font-weight:bold;font-variant-numeric:tabular-nums;}
.flag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:bold;letter-spacing:0.3px;padding:3px 9px;border-radius:999px;white-space:nowrap;}
.flag-negative{background:#FEE2E2;color:#991B1B;}.flag-sold_out{background:#FEF3C7;color:#B45309;}
.flag-low{background:#FEF9C3;color:#92400E;}.flag-healthy{background:#DCFCE7;color:#065F46;}
.pagination{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-top:1px solid var(--line-soft);background:var(--callout);}
.page-info{font-size:12.5px;color:var(--muted);}
.page-btns{display:flex;gap:6px;}
.page-btn{font-family:inherit;font-size:12.5px;font-weight:bold;padding:5px 13px;border-radius:8px;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--ink);transition:all .12s ease;}
.page-btn:hover:not(:disabled){border-color:#9CA3AF;}.page-btn:disabled{opacity:0.38;cursor:default;}
.empty{padding:56px 20px;text-align:center;color:var(--muted);font-size:14px;}
.footnote{font-size:12px;color:var(--faint);text-align:center;margin-top:24px;}
@media(max-width:800px){
  .summary{grid-template-columns:repeat(2,1fr);}
  .table-head,.row{grid-template-columns:2fr 1fr 0.7fr 1fr;}
  .th:nth-child(n+5),.td:nth-child(n+5){display:none;}
}
</style>

 "healthy"}, {"product": "Magnetic Card Holder", "variant": "75 pt.", "vendor": "CardsHQ", "sku": "1-MCH-75", "inventory": 545, "sold_ytd": 198, "last_sold": "Jun 23, 2026", "status": "active", "flag": "healthy"}, {"product": "Toploader 168 pt.", "variant": "", "vendor": "CardsHQ", "sku": "1-TLCH-TH-4.25MM", "inventory": 580, "sold_ytd": 131, "last_sold": "Jun 21, 2026", "status": "active", "flag": "healthy"}, {"product": "Cardboard Gold PSA Graded Perfect Fit Sleeves", "variant": "", "vendor": "CardsHQ", "sku": "", "inventory": 590, "sold_ytd": 18, "last_sold": "Mar 30, 2026", "status": "active", "flag": "healthy"}, {"product": "Semi-Rigid Card Holder", "variant": "#1", "vendor": "CardsHQ", "sku": "", "inventory": 623, "sold_ytd": 840, "last_sold": "Jun 23, 2026", "status": "active", "flag": "healthy"}, {"product": "Magnetic Card Holder", "variant": "180 pt.", "vendor": "CardsHQ", "sku": "1-MCH-180", "inventory": 698, "sold_ytd": 342, "last_sold": "Jun 9, 2026", "status": "active", "flag": "healthy"}, {"product": "Toploader 3x4 Premium 20pt", "variant": "", "vendor": "CardsHQ", "sku": "1-TLCH", "inventory": 783, "sold_ytd": 416, "last_sold": "Jun 22, 2026", "status": "active", "flag": "healthy"}, {"product": "Magnetic Card Holder", "variant": "55 pt.", "vendor": "CardsHQ", "sku": "1-MCH-55", "inventory": 796, "sold_ytd": 267, "last_sold": "Jun 23, 2026", "status": "active", "flag": "healthy"}, {"product": "Star Wars Unlimited Soft Crate", "variant": "Mandalorian / Moff Gideon", "vendor": "CardsHQ", "sku": "", "inventory": 808, "sold_ytd": 11, "last_sold": "Jun 23, 2026", "status": "active", "flag": "healthy"}, {"product": "Toploader 138 pt.", "variant": "", "vendor": "CardsHQ", "sku": "1-TLCH-TH-3.5MM", "inventory": 1051, "sold_ytd": 261, "last_sold": "Jun 24, 2026", "status": "active", "flag": "healthy"}, {"product": "Standard Card Sleeves", "variant": "", "vendor": "CardsHQ", "sku": "1-SSLV", "inventory": 1325, "sold_ytd": 10052, "last_sold": "Jun 24, 2026", "status": "active", "flag": "healthy"}, {"product": "Resealable Bags", "variant": "Team Set Bag", "vendor": "CardsHQ", "sku": "", "inventory": 1480, "sold_ytd": 426, "last_sold": "Jun 24, 2026", "status": "active", "flag": "healthy"}, {"product": "Toploader 108 pt.", "variant": "", "vendor": "CardsHQ", "sku": "", "inventory": 1493, "sold_ytd": 381, "last_sold": "Jun 24, 2026", "status": "active", "flag": "healthy"}, {"product": "Toploader 3x4 Standard", "variant": "", "vendor": "CardsHQ", "sku": "1-TLCH-N", "inventory": 1913, "sold_ytd": 6471, "last_sold": "Jun 24, 2026", "status": "active", "flag": "healthy"}, {"product": "Resealable Bags", "variant": "Graded Card Sleeves", "vendor": "CardsHQ", "sku": "1-RGCS", "inventory": 3058, "sold_ytd": 232, "last_sold": "Jun 20, 2026", "status": "active", "flag": "healthy"}, {"product": "Thick Card Sleeves", "variant": "", "vendor": "CardsHQ", "sku": "1-SSLV-THICK", "inventory": 7767, "sold_ytd": 1578, "last_sold": "Jun 24, 2026", "status": "active", "flag": "healthy"}, {"product": "nan", "variant": "", "vendor": "", "sku": "", "inventory": 43204, "sold_ytd": 39321, "last_sold": "", "status": "", "flag": "healthy"}];
const FLAG_META = {
  negative:{label:'Negative',dot:'#EF4444',text:'Negative Inventory'},
  sold_out:{label:'Sold Out',dot:'#F59E0B',text:'Sold Out'},
  low:{label:'Low Stock',dot:'#D97706',text:'Low (1-10 units)'},
  healthy:{label:'Healthy',dot:'#10B981',text:'Healthy'},
};
const FLAG_ORDER = ['negative','sold_out','low','healthy'];
const SORT_DEFAULTS = {inventory:'asc',flag:'asc',product:'asc',sold_ytd:'desc',last_sold:'desc',vendor:'asc',status:'asc'};

function FlagBadge({flag}){
  const m=FLAG_META[flag]||{};
  return React.createElement('span',{className:'flag flag-'+flag},
    React.createElement('span',{style:{width:6,height:6,borderRadius:'50%',background:m.dot,display:'inline-block',flexShrink:0}}),
    m.label
  );
}

function App(){
  const [search,setSearch]=useState('');
  const [flags,setFlags]=useState(new Set());
  const [sortKey,setSortKey]=useState('inventory');
  const [sortDir,setSortDir]=useState('asc');
  const [page,setPage]=useState(0);

  const toggleFlag=useCallback(f=>{
    setFlags(prev=>{const n=new Set(prev);n.has(f)?n.delete(f):n.add(f);return n;});
    setPage(0);
  },[]);

  const handleSort=useCallback(k=>{
    setSortKey(prev=>{
      if(prev===k){setSortDir(d=>d==='asc'?'desc':'asc');}
      else{setSortDir(SORT_DEFAULTS[k]||'asc');}
      return k;
    });
    setPage(0);
  },[]);

  const filtered=useMemo(()=>{
    let rows=ALL_RECORDS;
    if(flags.size>0) rows=rows.filter(r=>flags.has(r.flag));
    if(search.trim()){
      const q=search.toLowerCase();
      rows=rows.filter(r=>r.product.toLowerCase().includes(q)||r.variant.toLowerCase().includes(q)||r.sku.toLowerCase().includes(q));
    }
    return [...rows].sort((a,b)=>{
      let av=a[sortKey],bv=b[sortKey];
      if(sortKey==='inventory'||sortKey==='sold_ytd'){av=Number(av);bv=Number(bv);}
      else if(sortKey==='flag'){av=FLAG_ORDER.indexOf(av);bv=FLAG_ORDER.indexOf(bv);}
      else{av=String(av||'').toLowerCase();bv=String(bv||'').toLowerCase();}
      return sortDir==='asc'?(av<bv?-1:av>bv?1:0):(av>bv?-1:av<bv?1:0);
    });
  },[search,flags,sortKey,sortDir]);

  const totalPages=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));
  const safeP=Math.min(page,totalPages-1);
  const pageRows=filtered.slice(safeP*PAGE_SIZE,(safeP+1)*PAGE_SIZE);

  const counts=useMemo(()=>{
    const c={negative:0,sold_out:0,low:0,healthy:0};
    ALL_RECORDS.forEach(r=>c[r.flag]=(c[r.flag]||0)+1);
    return c;
  },[]);

  const summaryCards=[
    {key:'negative',label:'Negative Inventory',bar:'#EF4444',vc:'#991B1B',sub:'Reconcile today'},
    {key:'sold_out',label:'Sold Out',bar:'#F59E0B',vc:'#B45309',sub:'Set to draft + reorder'},
    {key:'low',label:'Low Stock (1-10)',bar:'#F59E0B',vc:'#92400E',sub:'Reorder soon'},
    {key:'healthy',label:'Healthy',bar:'#10B981',vc:'#065F46',sub:'No action needed'},
  ];

  const Th=({k,label})=>React.createElement('div',{className:'th'+(sortKey===k?' sorted':''),onClick:()=>handleSort(k)},
    label,React.createElement('span',{className:'sort-arrow'},sortKey===k?(sortDir==='asc'?'▲':'▼'):'⇅')
  );

  return React.createElement(React.Fragment,null,
    React.createElement('div',{className:'banner'},
      React.createElement('div',{className:'banner-inner'},
        React.createElement('div',{className:'brand-row'},
          React.createElement('div',{className:'brand-divider'}),
          React.createElement('div',null,
            React.createElement('div',{className:'brand-name'},'CardsHQ'),
            React.createElement('div',{className:'brand-sub'},'Supplies Audit · Inventory · Vendor · Last Sold')
          )
        ),
        React.createElement('div',{className:'banner-right'},
          React.createElement('div',{className:'snapshot-date'},'June 24, 2026'),
          React.createElement('div',{className:'timestamp'},'Source: Mipler · '+ALL_RECORDS.length.toLocaleString()+' variants')
        )
      )
    ),
    React.createElement('div',{className:'summary'},
      summaryCards.map(c=>React.createElement('div',{className:'s-card',key:c.key},
        React.createElement('div',{className:'accent-bar',style:{background:c.bar}}),
        React.createElement('div',{className:'label'},c.label),
        React.createElement('div',{className:'value',style:{color:c.vc}},(counts[c.key]||0).toLocaleString()),
        React.createElement('div',{className:'sub'},c.sub)
      ))
    ),
    React.createElement('div',{className:'controls'},
      React.createElement('div',{className:'controls-left'},
        React.createElement('h2',{className:'section-title'},'All Supplies'),
        React.createElement('div',{className:'chips'},
          FLAG_ORDER.map(f=>{
            const on=flags.has(f);
            return React.createElement('button',{key:f,className:'chip'+(on?' on':''),onClick:()=>toggleFlag(f)},
              !on&&React.createElement('span',{className:'chip-dot',style:{background:FLAG_META[f].dot}}),
              FLAG_META[f].text
            );
          })
        )
      ),
      React.createElement('div',{className:'search-wrap'},
        React.createElement('span',{className:'search-icon'},'🔍'),
        React.createElement('input',{className:'search-input',placeholder:'Search product or SKU…',value:search,onChange:e=>{setSearch(e.target.value);setPage(0);}})
      )
    ),
    React.createElement('div',{className:'table-wrap'},
      React.createElement('div',{className:'table-head'},
        React.createElement(Th,{k:'product',label:'Product'}),
        React.createElement(Th,{k:'flag',label:'Flag'}),
        React.createElement(Th,{k:'inventory',label:'Inventory'}),
        React.createElement(Th,{k:'sold_ytd',label:'Sold YTD'}),
        React.createElement(Th,{k:'last_sold',label:'Last Sold'}),
        React.createElement(Th,{k:'vendor',label:'Vendor'}),
        React.createElement(Th,{k:'status',label:'Status'})
      ),
      React.createElement('div',{className:'table-body'},
        pageRows.length===0
          ?React.createElement('div',{className:'empty'},'No results match your filters.')
          :pageRows.map((r,i)=>React.createElement('div',{className:'row',key:i},
            React.createElement('div',{className:'td td-product'},
              React.createElement('span',{className:'pname',title:r.product},r.product),
              r.variant&&React.createElement('span',{className:'pvariant'},r.variant)
            ),
            React.createElement('div',{className:'td'},React.createElement(FlagBadge,{flag:r.flag})),
            React.createElement('div',{className:'td td-num',style:{color:r.inventory<0?'#991B1B':r.inventory===0?'#B45309':r.inventory<=10?'#92400E':'#065F46'}},r.inventory),
            React.createElement('div',{className:'td td-num',style:{color:'#374151'}},r.sold_ytd.toLocaleString()),
            React.createElement('div',{className:'td',style:{fontSize:'12.5px',color:r.last_sold?'var(--ink)':'var(--faint)'}},r.last_sold||'Never sold'),
            React.createElement('div',{className:'td',style:{fontSize:'12.5px',color:'var(--muted)'}},r.vendor),
            React.createElement('div',{className:'td',style:{fontSize:'12px',color:'var(--muted)',textTransform:'capitalize'}},r.status)
          ))
      ),
      React.createElement('div',{className:'pagination'},
        React.createElement('span',{className:'page-info'},filtered.length.toLocaleString()+' results · page '+(safeP+1)+' of '+totalPages),
        React.createElement('div',{className:'page-btns'},
          React.createElement('button',{className:'page-btn',disabled:safeP===0,onClick:()=>setPage(p=>p-1)},'← Prev'),
          React.createElement('button',{className:'page-btn',disabled:safeP>=totalPages-1,onClick:()=>setPage(p=>p+1)},'Next →')
        )
      )
    ),
    React.createElement('div',{className:'footnote'},'CardsHQ · Supplies Audit · Mipler export June 24, 2026 · For: Jasmine')
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
