<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CardsHQ Buying Inventory</title>
<style>
  :root{
    --black:#111111;
    --blue:#3B82F6;
    --teal:#10B981;
    --amber:#D97706;
    --ink:#111827;
    --muted:#6B7280;
    --faint:#9CA3AF;
    --line:#D1D5DB;
    --line-soft:#E5E7EB;
    --callout:#F9FAFB;
    --page:#F3F4F6;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:Arial, Helvetica, sans-serif;
    background:var(--page);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #root{max-width:1240px;margin:0 auto;padding:0 20px 64px;}

  /* ---------- Header banner ---------- */
  .banner{
    background:var(--black);
    color:#fff;
    border-radius:0 0 16px 16px;
    margin:0 -20px 24px;
    padding:26px 28px 24px;
  }
  .banner-inner{max-width:1240px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;}
  .brand-row{display:flex;align-items:center;gap:14px;}
  .logo-mark{
    width:46px;height:46px;flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .logo-img{height:30px;width:auto;display:block;flex:none;}
  .brand-divider{width:1px;height:34px;background:rgba(255,255,255,0.22);flex:none;}
  .brand-name{font-size:22px;font-weight:bold;letter-spacing:-0.4px;line-height:1.05;}
  .brand-sub{font-size:12.5px;color:#9CA3AF;margin-top:3px;letter-spacing:0.2px;}
  .banner-right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .snapshot-date{font-size:15px;font-weight:bold;}
  .timestamp{font-size:12.5px;color:#9CA3AF;}
  .sample-badge{
    display:inline-flex;align-items:center;gap:7px;
    background:rgba(217,118,6,0.16);
    border:1px solid rgba(217,118,6,0.5);
    color:#FBBF77;
    font-size:11px;font-weight:bold;letter-spacing:1px;
    padding:5px 11px;border-radius:999px;text-transform:uppercase;
  }
  .sample-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);}

  /* segmented period control (dark) */
  .seg{display:inline-flex;background:#1C1C1C;border:1px solid #2E2E2E;border-radius:9px;padding:3px;gap:2px;}
  .seg-btn{
    font-family:inherit;font-size:12.5px;font-weight:bold;letter-spacing:0.2px;
    color:#9CA3AF;background:none;border:none;padding:6px 15px;border-radius:7px;cursor:pointer;
    transition:all .14s ease;
  }
  .seg-btn:hover{color:#E5E7EB;}
  .seg-btn.on{background:var(--teal);color:#fff;}

  /* ---------- Section heads ---------- */
  .eyebrow{font-size:11px;font-weight:bold;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);}

  /* ---------- Overview header + info ---------- */
  .overview-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 18px;}
  .oh-left{display:flex;align-items:center;gap:10px;}
  .oh-title{margin:0;font-size:19px;font-weight:bold;letter-spacing:-0.4px;color:var(--ink);}
  .info-wrap{position:relative;display:inline-flex;}
  .info-btn{
    width:22px;height:22px;border-radius:50%;flex:none;cursor:pointer;
    border:1.5px solid var(--line);background:#fff;color:var(--muted);
    font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:bold;font-size:13px;line-height:1;
    display:inline-flex;align-items:center;justify-content:center;transition:all .14s ease;
  }
  .info-btn:hover,.info-btn[aria-expanded="true"]{border-color:var(--blue);color:var(--blue);}
  .info-pop{
    position:absolute;top:calc(100% + 8px);left:0;z-index:60;
    width:min(380px,86vw);display:flex;flex-direction:column;gap:10px;
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;
    box-shadow:0 16px 40px rgba(17,17,17,0.18);
  }
  .info-pop-title{font-size:13px;font-weight:bold;letter-spacing:0.3px;color:var(--ink);}
  .info-pop-body{font-size:12.5px;line-height:1.55;color:#374151;}
  .info-pop-legend{display:flex;flex-direction:column;gap:7px;padding-top:10px;border-top:1px solid var(--line-soft);}
  .legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:#374151;font-weight:bold;}
  .swatch{width:12px;height:12px;border-radius:3px;flex:none;}

  /* ---------- Totals ---------- */
  .totals{
    display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;
  }
  .total-card{
    background:var(--card);border:1px solid var(--line-soft);border-radius:14px;
    padding:18px 20px;display:flex;flex-direction:column;gap:9px;
    box-shadow:0 1px 2px rgba(17,17,17,0.04);
  }
  .total-card .label{font-size:11px;font-weight:bold;letter-spacing:0.9px;text-transform:uppercase;color:var(--muted);}
  .total-card .value{font-size:37px;font-weight:bold;letter-spacing:-1.6px;line-height:1;}
  .total-card .sub{font-size:12px;color:var(--faint);}
  .accent-bar{height:3px;border-radius:2px;width:34px;}

  /* ---------- Filter (popup) ---------- */
  .filter-bar{position:relative;flex:none;}
  .filter-btn{
    display:inline-flex;align-items:center;gap:8px;flex:none;
    font-family:inherit;font-size:13.5px;font-weight:bold;color:var(--ink);
    background:#fff;border:1.5px solid var(--line);border-radius:10px;
    padding:9px 14px;cursor:pointer;transition:all .12s ease;
  }
  .filter-btn:hover{border-color:#9CA3AF;}
  .filter-btn.open{border-color:var(--black);box-shadow:0 0 0 3px rgba(17,17,17,0.06);}
  .filter-btn .caret{transition:transform .18s ease;color:var(--muted);}
  .filter-btn .caret.open{transform:rotate(180deg);}
  .filter-badge{
    font-size:11px;font-weight:bold;color:#fff;background:var(--blue);
    min-width:18px;height:18px;padding:0 5px;border-radius:999px;
    display:inline-flex;align-items:center;justify-content:center;line-height:1;
  }

  /* active-filter row (below totals) */
  .active-row{font-size:13px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:-6px 0 22px;}
  .active-label{font-size:11px;font-weight:bold;letter-spacing:0.9px;text-transform:uppercase;color:var(--faint);}
  .active-pill{
    display:inline-flex;align-items:center;gap:6px;background:#EEF2FF;color:#1E3A8A;
    border:1px solid #C7D2FE;border-radius:999px;font-size:12px;font-weight:bold;padding:3px 4px 3px 11px;
  }
  .active-pill .x{cursor:pointer;opacity:0.55;font-weight:bold;font-size:14px;padding:0 4px;border-radius:999px;}
  .active-pill .x:hover{opacity:1;background:rgba(30,58,138,0.12);}
  .clear-all{
    font-family:inherit;font-size:12.5px;font-weight:bold;color:var(--muted);
    background:none;border:none;cursor:pointer;text-decoration:underline;padding:3px 4px;
  }
  .clear-all:hover{color:var(--amber);}

  .group-label{font-size:11px;font-weight:bold;letter-spacing:0.9px;text-transform:uppercase;color:var(--faint);margin-bottom:9px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    font-family:inherit;font-size:13px;font-weight:bold;
    padding:7px 14px;border-radius:999px;cursor:pointer;
    border:1.5px solid var(--line);background:#fff;color:var(--muted);
    transition:all .12s ease;line-height:1;
  }
  .chip:hover{border-color:#9CA3AF;}
  .chip.on{background:var(--black);border-color:var(--black);color:#fff;}
  .chip.on:hover{background:#000;}

  /* popup panel */
  .menu-overlay{position:fixed;inset:0;z-index:40;background:transparent;}
  .filter-panel{
    position:absolute;top:calc(100% + 8px);right:0;z-index:50;
    width:min(440px,92vw);max-height:min(560px,80vh);display:flex;flex-direction:column;
    background:#fff;border:1px solid var(--line);border-radius:14px;
    box-shadow:0 18px 48px rgba(17,17,17,0.18);overflow:hidden;
  }
  .panel-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 16px;border-bottom:1px solid var(--line-soft);
  }
  .panel-title{font-size:14px;font-weight:bold;letter-spacing:0.2px;}
  .panel-reset{
    font-family:inherit;font-size:12.5px;font-weight:bold;color:var(--muted);
    background:none;border:none;cursor:pointer;text-decoration:underline;padding:0;
  }
  .panel-reset:hover:not(:disabled){color:var(--amber);}
  .panel-reset:disabled{opacity:0.4;cursor:default;text-decoration:none;}
  .panel-section{padding:14px 16px;}
  .panel-section.category{flex:none;}
  .panel-section.leagues{display:flex;flex-direction:column;flex:1;min-height:0;border-top:1px solid var(--line-soft);}
  .panel-section.leagues .menu-body{overflow-y:auto;flex:1;min-height:0;}
  .group-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
  .group-row .group-label{margin-bottom:0;}
  .menu-search{
    width:100%;font-family:inherit;font-size:13px;padding:9px 12px;margin-bottom:6px;
    border:1.5px solid var(--line);border-radius:9px;outline:none;color:var(--ink);
  }
  .menu-search:focus{border-color:var(--blue);}
  .menu-clear{
    font-family:inherit;font-size:12px;font-weight:bold;color:var(--muted);
    background:none;border:none;cursor:pointer;text-decoration:underline;padding:0;
  }
  .menu-clear:hover:not(:disabled){color:var(--ink);}
  .menu-clear:disabled{opacity:0.4;cursor:default;text-decoration:none;}
  .menu-body{}
  .menu-section{margin-top:10px;}
  .menu-section-label{
    font-size:10.5px;font-weight:bold;letter-spacing:0.9px;text-transform:uppercase;
    color:var(--faint);padding:0 0 6px 2px;
  }
  .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;}
  .menu-item{
    display:flex;align-items:center;gap:9px;width:100%;text-align:left;
    font-family:inherit;font-size:13px;font-weight:bold;color:var(--ink);
    background:none;border:none;padding:7px 8px;border-radius:8px;cursor:pointer;
  }
  .menu-item:hover{background:#F3F4F6;}
  .menu-item.on{color:#065F46;}
  .menu-item-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .check{
    width:18px;height:18px;flex:none;border-radius:5px;border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;
  }
  .check.on{background:var(--teal);border-color:var(--teal);}
  .menu-empty{padding:14px 4px;font-size:13px;color:var(--faint);}
  .panel-foot{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 16px;border-top:1px solid var(--line-soft);
    font-size:12.5px;font-weight:bold;color:var(--muted);
  }
  .menu-done{
    font-family:inherit;font-size:12.5px;font-weight:bold;color:#fff;
    background:var(--black);border:none;border-radius:9px;padding:9px 20px;cursor:pointer;
  }
  .menu-done:hover{background:#000;}

  /* ---------- Buckets ---------- */
  .bucket-section{margin-top:28px;}
  .cond-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;}
  .cond-title{font-size:18px;font-weight:bold;letter-spacing:-0.3px;}
  .cond-desc{font-size:12.5px;color:var(--muted);}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:12px;}

  .bucket{
    background:var(--card);border:1px solid var(--line-soft);border-radius:14px;
    padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px;
    box-shadow:0 1px 2px rgba(17,17,17,0.04);
    transition:box-shadow .15s ease, border-color .15s ease;
  }
  .bucket:hover{box-shadow:0 4px 14px rgba(17,17,17,0.07);border-color:var(--line);}
  .bucket-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .bucket-tier{font-size:15px;font-weight:bold;letter-spacing:-0.2px;}
  .bucket-range{font-size:12px;color:var(--faint);margin-top:2px;}
  .net-tag{font-size:12px;font-weight:bold;padding:3px 8px;border-radius:6px;white-space:nowrap;}

  .flow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end;}
  .flow .cell{display:flex;flex-direction:column;gap:3px;}
  .flow .cell .k{font-size:10px;font-weight:bold;letter-spacing:0.7px;text-transform:uppercase;color:var(--faint);}
  .flow .v-in{font-size:21px;font-weight:bold;color:var(--teal);letter-spacing:-0.5px;line-height:1;}
  .flow .v-out{font-size:21px;font-weight:bold;color:var(--blue);letter-spacing:-0.5px;line-height:1;}
  .flow .v-hand{font-size:26px;font-weight:bold;color:var(--ink);letter-spacing:-1px;line-height:1;}
  .flow .cell.hand{align-items:flex-end;text-align:right;}

  .pushpull{display:flex;flex-direction:column;gap:5px;}
  .bar-row{display:flex;align-items:center;gap:8px;}
  .bar-key{font-size:10px;font-weight:bold;letter-spacing:0.5px;color:var(--faint);width:26px;flex:none;}
  .bar-track{flex:1;height:7px;background:#F1F3F5;border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:4px;}

  .read{
    display:flex;align-items:center;gap:8px;font-size:13px;font-weight:bold;
    padding:9px 11px;border-radius:9px;line-height:1.2;
  }
  .read .rdot{width:8px;height:8px;border-radius:50%;flex:none;}

  .empty-bucket{font-size:13px;color:var(--faint);font-weight:bold;padding:8px 0;}

  .footnote{font-size:12px;color:var(--faint);text-align:center;margin-top:30px;line-height:1.6;}

  /* Category drill-down */
  .cat-section{margin-top:34px;}
  .cat-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;}
  .cat-title{font-size:18px;font-weight:bold;letter-spacing:-0.3px;}
  .cat-desc{font-size:12.5px;color:var(--muted);}
  .cat-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line-soft);border-radius:12px;overflow:hidden;}
  .cat-table th{font-size:10.5px;font-weight:bold;letter-spacing:0.6px;text-transform:uppercase;color:#fff;background:var(--ink);text-align:right;padding:9px 14px;}
  .cat-table th.l{text-align:left;}
  .cat-table td{font-size:14px;padding:9px 14px;text-align:right;border-top:1px solid var(--line-soft);color:var(--ink);}
  .cat-table td.l{text-align:left;font-weight:bold;letter-spacing:-0.2px;}
  .cat-table tr:hover td{background:#F9FAFB;}
  .cat-table tr.cat-total td{background:#F3F4F6;font-weight:bold;border-top:2px solid var(--line);}
  .cat-table tr.cat-total td.l{color:var(--ink);}
  .cat-sub{font-size:11.5px;color:var(--faint);font-weight:normal;}
  .cat-m{font-weight:bold;color:var(--teal);}
  .cat-flow-pos{color:var(--teal);font-weight:bold;}
  .cat-flow-neg{color:var(--blue);font-weight:bold;}

  /* Collapsible section headers */
  .cat-collapse-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;padding:12px 16px;background:#fff;border:1px solid var(--line-soft);border-radius:12px;cursor:pointer;user-select:none;}
  .cat-collapse-head:hover{background:#F9FAFB;}
  .cat-collapse-head.sold{border-left:3px solid var(--blue);}
  .cat-caret{font-size:12px;color:var(--muted);width:14px;display:inline-block;}
  .cat-caret.sm{font-size:10px;margin-right:6px;}
  .cat-head-summary{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap;}
  .cat-subject-row{cursor:pointer;user-select:none;}
  .cat-cond-row td{background:#F9FAFB;font-size:13px;}
  .cat-cond-row td.cond{font-weight:normal;color:var(--muted);padding-left:38px;}

  /* Tier breakdown inside rollup cards */
  .rollup-caret{font-size:11px;color:#9CA3AF;margin-left:6px;}
  .rollup-tiers{margin-top:14px;border-top:1px solid rgba(255,255,255,0.12);padding-top:10px;}
  .rollup-tier-row{display:flex;align-items:baseline;gap:14px;padding:5px 0;font-size:12.5px;}
  .rollup-tier-row .rt-name{font-weight:bold;color:#D1D5DB;width:104px;flex-shrink:0;}
  .rollup-tier-row .rt-cell{color:#E5E7EB;}
  .rollup-tier-row .rt-cell.blue{color:#60A5FA;}
  .rollup-tier-row .rt-cell.teal{color:#34D399;}
  .rollup-tier-row .rt-cell.flow{margin-left:auto;color:#9CA3AF;}

  /* Historical view */
  .hist-controls{display:flex;gap:8px;margin:14px 0;}
  .hist-range-btn{font-size:12px;font-weight:bold;padding:6px 14px;border-radius:8px;border:1px solid var(--line-soft);background:#fff;color:var(--muted);cursor:pointer;}
  .hist-range-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .hist-charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:900px){.hist-charts{grid-template-columns:1fr;}}
  .hist-chart{background:#fff;border:1px solid var(--line-soft);border-radius:12px;padding:16px;}
  .hist-chart h4{margin:0 0 4px;font-size:13px;font-weight:bold;color:var(--ink);}
  .hist-chart .hc-sub{font-size:11.5px;color:var(--faint);margin-bottom:10px;}
  .hist-legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:8px;}
  .hist-legend .dot{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:5px;vertical-align:middle;}
  .hist-note{font-size:11.5px;color:var(--faint);margin-top:12px;}
  .hist-custom{display:flex;align-items:center;gap:6px;margin-left:10px;}
  .hist-date{font-size:12px;font-family:Arial;padding:5px 8px;border-radius:8px;border:1px solid var(--line-soft);color:var(--ink);background:#fff;}
  .hist-to{font-size:11.5px;color:var(--faint);}
  .hist-clear{font-size:11.5px;font-weight:bold;padding:5px 10px;border-radius:8px;border:1px solid var(--line-soft);background:#fff;color:var(--blue);cursor:pointer;}
  @media(max-width:640px){.hist-controls{flex-wrap:wrap;}.hist-custom{margin-left:0;}}
  /* Trend range bar - top of page, by the filter */
  .trend-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 18px;padding:10px 12px;background:#F9FAFB;border:1px solid var(--line-soft);border-radius:10px;}
  .tr-label{font-size:12px;font-weight:bold;color:var(--ink);margin-right:2px;}
  .tr-note{margin-left:auto;font-size:11px;color:var(--faint);}
  .asof-banner{margin:14px 0 4px;padding:10px 16px;background:#EFF6FF;border:1px solid #BFDBFE;border-left:3px solid var(--blue);border-radius:10px;font-size:12.5px;color:var(--ink);}
  @media(max-width:640px){.tr-note{margin-left:0;width:100%;}}
  /* Interactive chart tooltip */
  .hc-wrap{position:relative;}
  .hc-tip{position:absolute;top:2px;pointer-events:none;background:#111111;color:#fff;border-radius:8px;padding:7px 9px;font-size:11px;font-family:Arial;box-shadow:0 4px 14px rgba(17,17,17,0.18);white-space:nowrap;z-index:5;transform:translateX(8px);}
  .hc-tip.flip{transform:translateX(-8px) translateX(-100%);}
  .hc-tip-date{font-weight:bold;font-size:11px;margin-bottom:4px;color:#fff;}
  .hc-tip-row{display:flex;align-items:center;gap:6px;line-height:1.55;}
  .hc-tip-dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .hc-tip-name{color:#D1D5DB;}
  .hc-tip-val{margin-left:auto;font-weight:bold;color:#fff;padding-left:14px;}

  /* Graded rollup strip + condition split */
  .cond-rollup{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px;}
  .rollup-card{background:var(--ink);border-radius:12px;padding:16px 18px;color:#fff;}
  .rollup-card.graded{background:var(--ink);}
  .rollup-card.raw{background:#1F2937;}
  .rollup-label{font-size:11px;font-weight:bold;letter-spacing:0.7px;text-transform:uppercase;color:#9CA3AF;}
  .rollup-units{font-size:30px;font-weight:bold;letter-spacing:-1px;margin-top:4px;line-height:1;}
  .rollup-row{display:flex;gap:22px;margin-top:12px;}
  .rollup-metric .k{font-size:10px;font-weight:bold;letter-spacing:0.5px;text-transform:uppercase;color:#9CA3AF;}
  .rollup-metric .v{font-size:15px;font-weight:bold;margin-top:2px;}
  .rollup-metric .v.teal{color:#34D399;}
  .rollup-metric .v.blue{color:#60A5FA;}

  /* Sold-side daily view */
  .sold-section{margin-top:34px;}
  .sold-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;}
  .sold-title{font-size:18px;font-weight:bold;letter-spacing:-0.3px;}
  .sold-desc{font-size:12.5px;color:var(--muted);}
  .sold-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line-soft);border-radius:12px;overflow:hidden;}

<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;

const COLORS = { black:'#111111', blue:'#3B82F6', teal:'#10B981', amber:'#D97706', ink:'#111827', muted:'#6B7280' };

/* ============================================================
   SAMPLE DATA  (deterministic, seeded — stable across reloads)
   ============================================================ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// Seven buy-report price bins (Jimmy, Jul 23 2026). Lower-bound inclusive:
// $500 lands in $500-1K, $1,000 lands in $1K+. Keys must match tags.config.json.
const TIERS = [
  { key:'$1K+',     label:'$1,000+',     range:'$1,000 and up' },
  { key:'$500-1K',  label:'$500 - $1K',  range:'$500 – $999' },
  { key:'$250-500', label:'$250 - $500', range:'$250 – $499' },
  { key:'$150-250', label:'$150 - $250', range:'$150 – $249' },
  { key:'$50-150',  label:'$50 - $150',  range:'$50 – $149' },
  { key:'$25-50',   label:'$25 - $50',   range:'$25 – $49' },
  { key:'<$25',     label:'Under $25',   range:'Below $25' },
];
const CONDS = ['Raw','Graded'];

// Real CardsHQ catalog (Boxes excluded per Jimmy; non-card lines omitted).
// c = category, w = relative popularity weight, conds = condition variants that exist.
const SUBJECTS = [
  // ---- Sports ----
  { n:'Baseball',     c:'Sports', w:1.40 },
  { n:'Basketball',   c:'Sports', w:1.40 },
  { n:'Football',     c:'Sports', w:1.30 },
  { n:'Soccer',       c:'Sports', w:0.95 },
  { n:'Hockey',       c:'Sports', w:0.70 },
  { n:'Multi-Sport',  c:'Sports', w:0.70 },
  { n:'UFC',          c:'Sports', w:0.60 },
  { n:'F1',           c:'Sports', w:0.60 },
  { n:'Wrestling',    c:'Sports', w:0.55 },
  { n:'Other Sports', c:'Sports', w:0.50 },
  { n:'Boxing',       c:'Sports', w:0.45 },
  { n:'NASCAR',       c:'Sports', w:0.40 },
  { n:'Golf',         c:'Sports', w:0.40 },
  { n:'Tennis',       c:'Sports', w:0.35 },
  // ---- TCG ----
  { n:'Pokemon',             c:'TCG', w:1.50 },
  { n:'Magic the Gathering', c:'TCG', w:1.20 },
  { n:'One Piece',           c:'TCG', w:1.10 },
  { n:'Yu-Gi-Oh',            c:'TCG', w:1.00 },
  { n:'Disney Lorcana',      c:'TCG', w:0.90 },
  { n:'Star Wars Unlimited', c:'TCG', w:0.70 },
  { n:'Dragon Ball',         c:'TCG', w:0.60 },
  { n:'Digimon',             c:'TCG', w:0.50 },
  { n:'Gundam',              c:'TCG', w:0.50 },
  { n:'Union Arena',         c:'TCG', w:0.45 },
  { n:'Riftbound',           c:'TCG', w:0.40 },
  { n:'Elestrals',           c:'TCG', w:0.30 },
  // ---- Entertainment / Non-Sport (filed under TCG per Jimmy) ----
  { n:'Marvel',            c:'TCG', w:0.80 },
  { n:'Star Wars Topps',   c:'TCG', w:0.70 },
  { n:'DC',                c:'TCG', w:0.65 },
  { n:'Pop-Culture',       c:'TCG', w:0.60 },
  { n:'Harry Potter',      c:'TCG', w:0.60 },
  { n:'Disney Topps',      c:'TCG', w:0.55 },
  { n:'Media IP',          c:'TCG', w:0.50 },
  { n:'Stranger Things',   c:'TCG', w:0.45 },
  { n:'Garbage Pail Kids', c:'TCG', w:0.40, conds:['Graded'] },
];
// Quick-pick chips shown inline; the rest live behind the "More" menu.
const COMMON = ['Pokemon','Basketball','Baseball','Football','Magic the Gathering','One Piece','Yu-Gi-Oh','Soccer','Marvel','Disney Lorcana'];

// per-record on-hand base ranges by tier + condition (scaled by subject weight)
const BASE = {
  High:{ Raw:[0,3],  Graded:[1,6]  },
  Mid: { Raw:[14,60], Graded:[7,28] },
  Low: { Raw:[80,400],Graded:[5,22] },
};

function buildRecords(){
  const rng = mulberry32(20260608);
  const recs = [];
  SUBJECTS.forEach(s=>{
    const conds = s.conds || CONDS;
    TIERS.forEach(t=>{
      conds.forEach(cond=>{
        const [lo,hi] = BASE[t.key][cond];
        const onhand = Math.round((lo + rng()*(hi-lo)) * s.w);
        if(onhand<=0){
          recs.push({ category:s.c, subject:s.n, tier:t.key, cond, onhand:0,
            p:{ daily:{in:0,out:0}, weekly:{in:0,out:0}, monthly:{in:0,out:0} } });
          return;
        }
        let inn, out;
        if(t.key==='High'){
          // high-value acquisitions are episodic — intake usually dried up; steady sales => buy signals
          inn = rng()<0.78 ? 0 : 1;
          const r = rng();
          out = r<0.5 ? 1 : (r<0.78 ? 2 : 0);
        } else if(t.key==='Mid'){
          // mid tier is restocked in batches (collection buys) — often building
          inn = Math.round(onhand*(0.045+rng()*0.13));
          out = Math.round(onhand*(0.005+rng()*0.105));
        } else { // Low — high floor churn, sells a touch faster than it restocks
          inn = Math.round(onhand*(0.015+rng()*0.105));
          out = Math.round(onhand*(0.02+rng()*0.115));
        }

        // ---- Roll the daily flow up into weekly (7d) and monthly (30d) windows ----
        // On-hand is a live snapshot (constant); only the flow accumulates per window.
        const wN = 0.85 + rng()*0.3, mN = 0.85 + rng()*0.3; // per-window lumpiness
        let weekly, monthly;
        if(t.key==='High'){
          // sales accrue steadily regardless of yesterday; intake is episodic and "catches up" over time
          const wOut = 1 + Math.round(rng()*3);
          const wIn  = (rng()<0.5?0:1) + (rng()<0.22?1:0);
          const mOut = wOut*3 + Math.round(rng()*4);
          const mIn  = wIn + (rng()<0.6?1:0) + (rng()<0.35?1:0) + (rng()<0.15?2:0);
          weekly  = { in:wIn,  out:wOut };
          monthly = { in:mIn,  out:mOut };
        } else {
          const wMul = 5.5 + rng()*2.0;  // ~days of accumulation
          const mMul = 3.7 + rng()*1.1;  // weekly -> monthly
          const wIn = Math.round(inn*wMul*wN), wOut = Math.round(out*wMul*wN);
          weekly  = { in:wIn, out:wOut };
          monthly = { in:Math.round(wIn*mMul*mN), out:Math.round(wOut*mMul*mN) };
        }

        // ---- Sample valuation: tier-typical unit price + ~62% cost ratio ----
        // Real data.json carries val{} + sold fields from the Shopify pull; this
        // only backfills the sample fallback so value/margin render before first pull.
        const UNIT_PRICE = { High:{Raw:1600,Graded:2200}, Mid:{Raw:320,Graded:410}, Low:{Raw:9,Graded:32} };
        const px = UNIT_PRICE[t.key][cond];
        const costRatio = 0.55 + rng()*0.14; // 55-69% of retail
        const retail = Math.round(onhand * px);
        const cost = Math.round(retail * costRatio);
        const soldRevenue = Math.round(out * px);
        const soldCost = Math.round(soldRevenue * costRatio);

        recs.push({ category:s.c, subject:s.n, tier:t.key, cond, onhand,
          val:{ cost, retail },
          p:{ daily:{in:inn,out:out,soldCost,soldRevenue}, weekly, monthly } });
      });
    });
  });
  return recs;
}
const SAMPLE_RECORDS = buildRecords(); // fallback only - real data comes from data.json

/* ============================================================
   FILTER MODEL  — faceted: OR within group, AND across groups,
   a fully-selected (or empty) group = wildcard (no constraint)
   ============================================================ */
const GROUPS = [
  { key:'category', field:'category', label:'Category',     tags:['Sports','TCG'] },
  { key:'league',   field:'subject',  label:'Sport / Game', tags: SUBJECTS.map(s=>s.n) },
];
const CATEGORY = GROUPS[0], LEAGUE = GROUPS[1];
const GAME_CAT = Object.fromEntries(SUBJECTS.map(s=>[s.n, s.c]));

// Inclusion model: an empty selection within a group = no constraint (show all).
// Selecting tags narrows to exactly those.
function matches(rec, selected){
  for(const g of GROUPS){
    const sel = g.tags.filter(t=>selected.has(t));
    if(sel.length===0) continue;            // group unconstrained
    if(!sel.includes(rec[g.field])) return false;
  }
  return true;
}
const groupActive = (group, selected) => group.tags.some(t=>selected.has(t));

// Dynamic auto-tagging: keep Category in sync with the finer Sport/Game picks.
function reconcile(next, touched){
  if(touched==='league'){
    const games = LEAGUE.tags.filter(t=>next.has(t));
    const cats = new Set(games.map(g=>GAME_CAT[g]));
    CATEGORY.tags.forEach(c=>next.delete(c));     // category is derived from games
    cats.forEach(c=>next.add(c));
  } else if(touched==='category'){
    const cats = CATEGORY.tags.filter(t=>next.has(t));
    if(cats.length>0){
      LEAGUE.tags.forEach(g=>{ if(next.has(g) && !cats.includes(GAME_CAT[g])) next.delete(g); });
    }
  }
  return next;
}

/* ============================================================
   AGGREGATION + READS
   ============================================================ */
function aggregate(records){
  return records.reduce((a,r)=>{
    const f=r.p.daily;
    a.in+=f.in; a.out+=f.out; a.onhand+=r.onhand;
    // value fields (guard for older/sample records without them)
    const v = r.val || {};
    a.cost   += v.cost   || 0;
    a.retail += v.retail || 0;
    a.soldCost    += f.soldCost    || 0;
    a.soldRevenue += f.soldRevenue || 0;
    return a;
  },{in:0,out:0,onhand:0,cost:0,retail:0,soldCost:0,soldRevenue:0});
}
const usd = n => '$' + Math.round(n||0).toLocaleString('en-US');
const marginPct = (rev,cost) => rev>0 ? Math.round(((rev-cost)/rev)*100) : 0;
function readOf(inv){
  const i=inv.in, o=inv.out;
  if(o<=0 && i<=0) return { label:'No movement yesterday', tone:'neutral' };
  if(o>0 && i/o < 0.22) return { label: i===0 ? 'Selling with no intake — buy signal' : 'Intake dried up — buy signal', tone:'amber' };
  if(o > i) return { label:'Selling faster than intake', tone:'blue' };
  if(i > o) return { label:'Building stock', tone:'teal' };
  return { label:'Balanced flow', tone:'neutral' };
}
const TONE = {
  teal:   { dot:COLORS.teal,  bg:'#ECFDF5', fg:'#065F46' },
  blue:   { dot:COLORS.blue,  bg:'#EFF6FF', fg:'#1E40AF' },
  amber:  { dot:COLORS.amber, bg:'#FFF7ED', fg:'#9A3412' },
  neutral:{ dot:'#9CA3AF',    bg:'#F3F4F6', fg:'#374151' },
};
const fmt = n => n.toLocaleString('en-US');

// Single daily snapshot for now (weekly/monthly to revisit later).
const SNAPSHOT = { range:'Mon, Jun 8, 2026', stamp:'As of 8:00 AM ET · yesterday', added:'Added Yesterday', sold:'Sold Yesterday' };

/* ============================================================
   COMPONENTS
   ============================================================ */
function Banner({ isSample, dateLabel, stampLabel }){
  return (
    <div className="banner">
      <div className="banner-inner">
        <div className="brand-row">
          <img className="logo-img" src="assets/cardshq-logo.png" alt="CardsHQ" />
          <span className="brand-divider"></span>
          <div>
            <div className="brand-name">Buying Inventory</div>
            <div className="brand-sub">Inventory snapshot · Cards · All channels (Online + In-store POS)</div>
          </div>
        </div>
        <div className="banner-right">
          {isSample && <span className="sample-badge"><span className="dot"></span>Sample data</span>}
          <div className="snapshot-date">{dateLabel}</div>
          <div className="timestamp">{stampLabel}</div>
        </div>
      </div>
    </div>
  );
}

function InfoButton(){
  const [open, setOpen] = useState(false);
  const legend = [
    { c:COLORS.teal,  t:'In — units added' },
    { c:COLORS.blue,  t:'Out — units sold' },
    { c:COLORS.amber, t:'Negative net & buy signals' },
  ];
  return (
    <span className="info-wrap" onMouseEnter={()=>setOpen(true)} onMouseLeave={()=>setOpen(false)}>
      <button className="info-btn" aria-label="How to read this" aria-expanded={open} onClick={()=>setOpen(o=>!o)}>i</button>
      {open && (
        <span className="info-pop" role="tooltip">
          <span className="info-pop-title">How to read this</span>
          <span className="info-pop-body">On-hand alone doesn't tell you much. Read each bucket as a <b>push vs. pull</b> — units coming <b>in</b> against units going <b>out</b>. Low stock is healthy when it's selling with steady intake; it's only a problem when intake has dried up. Each bucket calls it: <b>building stock</b>, <b>selling faster than intake</b>, or <b>selling with no intake — a buy signal</b>.</span>
          <span className="info-pop-legend">
            {legend.map((x,i)=>(
              <span className="legend-item" key={i}><span className="swatch" style={{background:x.c}}></span>{x.t}</span>
            ))}
          </span>
        </span>
      )}
    </span>
  );
}

function Totals({ totals }){
  const marginDollars = totals.retail - totals.cost;
  const mPct = marginPct(totals.retail, totals.cost);
  const cards = [
    { label:'Total On Hand', value:fmt(totals.onhand), sub:'units across all buckets', accent:COLORS.black, color:COLORS.ink },
    { label:'On-Hand Value (Cost)', value:usd(totals.cost), sub:'what we have tied up', accent:COLORS.black, color:COLORS.ink },
    { label:'Retail Value', value:usd(totals.retail), sub:'value if it all sells', accent:COLORS.blue, color:COLORS.blue },
    { label:'Unrealized Margin', value:usd(marginDollars), sub:mPct+'% of retail', accent:COLORS.teal, color:COLORS.teal },
  ];
  return (
    <div className="totals">
      {cards.map((c,i)=>(
        <div className="total-card" key={i}>
          <div className="value" style={{color:c.color}}>{c.value}</div>
          <div className="label">{c.label}</div>
          <div className="sub">{c.sub}</div>
        </div>
      ))}
    </div>
  );
}

function FilterBar({ selected, setSelected }){
  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState('');

  const toggle = (tag, group) => {
    const next = new Set(selected);
    next.has(tag) ? next.delete(tag) : next.add(tag);
    reconcile(next, group.key); // dynamic auto-tagging across groups
    setSelected(next);
  };
  const reset = (e) => { if(e) e.stopPropagation(); setSelected(new Set()); };
  const clearLeague = () => {
    const next = new Set(selected);
    LEAGUE.tags.forEach(t=>next.delete(t));
    reconcile(next, 'league'); // also clears the derived category tags
    setSelected(next);
  };

  const activeGroups = GROUPS.filter(g=>groupActive(g, selected));
  const isFiltered = activeGroups.length > 0;
  const activeCount = activeGroups.reduce((n,g)=>n + g.tags.filter(t=>selected.has(t)).length, 0);
  const leagueSelected = LEAGUE.tags.filter(t=>selected.has(t));

  const q = query.trim().toLowerCase();
  const menuSections = CATEGORY.tags.map(cat=>({
    cat,
    items: LEAGUE.tags.filter(t=>GAME_CAT[t]===cat && t.toLowerCase().includes(q)),
  })).filter(sec=>sec.items.length>0);

  return (
    <div className="filter-bar">
      <button className={'filter-btn'+(open?' open':'')} onClick={()=>setOpen(o=>!o)} aria-expanded={open}>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
        <span>Filter</span>
        {isFiltered && <span className="filter-badge">{activeCount}</span>}
        <svg className={'caret'+(open?' open':'')} width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>

      {open && (
        <React.Fragment>
          <div className="menu-overlay" onClick={()=>setOpen(false)}></div>
          <div className="filter-panel" role="dialog" aria-label="Filter inventory by tag">
            <div className="panel-head">
              <span className="panel-title">Filter inventory</span>
              <button className="panel-reset" onClick={reset} disabled={!isFiltered}>Reset to all</button>
            </div>

            <div className="panel-section category">
              <div className="group-label">Category</div>
              <div className="chips">
                {CATEGORY.tags.map(t=>(
                  <button key={t} className={'chip'+(selected.has(t)?' on':'')} onClick={()=>toggle(t,CATEGORY)}>{t}</button>
                ))}
              </div>
            </div>

            <div className="panel-section leagues">
              <div className="group-row">
                <div className="group-label">Sport / Game</div>
                <button className="menu-clear" onClick={clearLeague} disabled={leagueSelected.length===0}>Clear</button>
              </div>
              <input className="menu-search" placeholder="Search sports & games…" value={query}
                onChange={e=>setQuery(e.target.value)} autoFocus/>
              <div className="menu-body">
                {menuSections.length===0 && <div className="menu-empty">No tags match “{query}”.</div>}
                {menuSections.map(sec=>(
                  <div className="menu-section" key={sec.cat}>
                    <div className="menu-section-label">{sec.cat}</div>
                    <div className="menu-grid">
                      {sec.items.map(t=>{
                        const on = selected.has(t);
                        return (
                          <button key={t} className={'menu-item'+(on?' on':'')} onClick={()=>toggle(t,LEAGUE)}>
                            <span className={'check'+(on?' on':'')}>{on?'✓':''}</span>
                            <span className="menu-item-label">{t}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="panel-foot">
              <span>{activeCount ? activeCount+' filter'+(activeCount!==1?'s':'')+' active' : 'No filters — showing all'}</span>
              <button className="menu-done" onClick={()=>setOpen(false)}>Done</button>
            </div>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

function ActiveFilters({ selected, setSelected }){
  const toggle = (tag, group) => {
    const next = new Set(selected);
    next.has(tag) ? next.delete(tag) : next.add(tag);
    reconcile(next, group.key);
    setSelected(next);
  };
  const reset = () => setSelected(new Set());
  const activeGroups = GROUPS.filter(g=>groupActive(g, selected));
  if(activeGroups.length===0) return null;
  return (
    <div className="active-row">
      <span className="active-label">Showing</span>
      {activeGroups.map(g =>
        g.tags.filter(t=>selected.has(t)).map(t=>(
          <span className="active-pill" key={t}>{t}<span className="x" onClick={()=>toggle(t,g)}>×</span></span>
        ))
      )}
      <button className="clear-all" onClick={reset}>Clear all</button>
    </div>
  );
}

function Bucket({ tier, inv }){
  const empty = inv.onhand===0 && inv.in===0 && inv.out===0;
  const net = inv.in - inv.out;
  const r = readOf(inv);
  const tone = TONE[r.tone];
  const max = Math.max(inv.in, inv.out, 1);
  const netPos = net >= 0;
  const netStyle = netPos
    ? { background:'#ECFDF5', color:'#065F46' }
    : { background:'#FFF7ED', color:'#9A3412' };

  return (
    <div className="bucket">
      <div className="bucket-top">
        <div>
          <div className="bucket-tier">{tier.label}</div>
          <div className="bucket-range">{tier.range}</div>
        </div>
        {!empty && (
          <span className="net-tag" style={netStyle}>Net {netPos?'+':'−'}{fmt(Math.abs(net))}</span>
        )}
      </div>

      {empty ? (
        <div className="empty-bucket">No matching inventory in this slice.</div>
      ) : (
        <React.Fragment>
          <div className="flow">
            <div className="cell">
              <div className="k">In</div>
              <div className="v-in">+{fmt(inv.in)}</div>
            </div>
            <div className="cell">
              <div className="k">Out</div>
              <div className="v-out">−{fmt(inv.out)}</div>
            </div>
            <div className="cell hand">
              <div className="k">On Hand</div>
              <div className="v-hand">{fmt(inv.onhand)}</div>
            </div>
          </div>

          <div className="pushpull">
            <div className="bar-row">
              <span className="bar-key" style={{color:COLORS.teal}}>IN</span>
              <span className="bar-track"><span className="bar-fill" style={{width:(inv.in/max*100)+'%', background:COLORS.teal}}></span></span>
            </div>
            <div className="bar-row">
              <span className="bar-key" style={{color:COLORS.blue}}>OUT</span>

/* ============================================================
   GRADED ROLLUP
   Surfaces the graded (and raw) totals directly — no manual summing.
   ============================================================ */
function GradedRollup({ records }){
  const [open, setOpen] = useState({});
  const TIER_ORDER = TIERS.map(t=>t.key);
  const TIER_LABEL = TIERS.reduce((m,t)=>{ m[t.key]=t.label; return m; }, {});
  const Card = ({cls, cond, label})=>{
    const condRecs = records.filter(r=>r.cond===cond);
    const agg = aggregate(condRecs);
    const isOpen = !!open[cond];
    return (
      <div className={"rollup-card "+cls} onClick={()=>setOpen(o=>({...o,[cond]:!o[cond]}))} style={{cursor:'pointer'}}>
        <div className="rollup-label">{label} <span className="rollup-caret">{isOpen?'▾':'▸'}</span></div>
        <div className="rollup-units">{fmt(agg.onhand)} <span style={{fontSize:'14px',fontWeight:'normal',color:'#9CA3AF'}}>units</span></div>
        <div className="rollup-row">
          <div className="rollup-metric"><div className="k">Value (Cost)</div><div className="v">{usd(agg.cost)}</div></div>
          <div className="rollup-metric"><div className="k">Retail</div><div className="v blue">{usd(agg.retail)}</div></div>
          <div className="rollup-metric"><div className="k">Margin</div><div className="v teal">{usd(agg.retail-agg.cost)} · {marginPct(agg.retail,agg.cost)}%</div></div>
        </div>
        {isOpen && (
          <div className="rollup-tiers">
            {TIER_ORDER.map(t=>{
              const a = aggregate(condRecs.filter(r=>r.tier===t));
              return (
                <div className="rollup-tier-row" key={t}>
                  <span className="rt-name">{TIER_LABEL[t]}</span>
                  <span className="rt-cell">{fmt(a.onhand)} u</span>
                  <span className="rt-cell">{usd(a.cost)}</span>
                  <span className="rt-cell blue">{usd(a.retail)}</span>
                  <span className="rt-cell teal">{usd(a.retail-a.cost)} · {marginPct(a.retail,a.cost)}%</span>
                  <span className="rt-cell flow">+{fmt(a.in)} / −{fmt(a.out)}</span>
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  };
  return (
    <div className="cond-rollup">
      <Card cls="graded" cond="Graded" label="Graded — Total on Hand"/>
      <Card cls="raw"    cond="Raw"    label="Raw — Total on Hand"/>
    </div>
  );
}

/* ============================================================
   SOLD-SIDE DAILY VIEW
   What sold yesterday, by category — revenue, cost, and margin.
   Serves the revenue meeting and the cost meeting from one source.
   ============================================================ */
function SoldSide({ records }){
  const cats = useMemo(()=>{
    const m = new Map();
    for(const r of records){
      if((r.p.daily.out||0)<=0) continue;
      if(!m.has(r.category)) m.set(r.category, []);
      m.get(r.category).push(r);
    }
    return m;
  }, [records]);

  const rows = [...cats.entries()].map(([category, recs])=>({ category, agg:aggregate(recs) }))
    .sort((a,b)=> b.agg.soldRevenue - a.agg.soldRevenue);
  const tot = aggregate([...cats.values()].flat());
  const [open, setOpen] = useState(false);

  return (
    <div className="sold-section">
      <div className="cat-collapse-head sold" onClick={()=>setOpen(o=>!o)}>
        <span className="cat-caret">{open?'▾':'▸'}</span>
        <span className="cat-title">Sold Yesterday</span>
        <span className="cat-desc">Revenue, cost, and margin on what moved</span>
        <span className="cat-head-summary">
          {fmt(tot.out)} units · {usd(tot.soldRevenue)} rev · {usd(tot.soldCost)} cost · <span className="cat-m">{usd(tot.soldRevenue-tot.soldCost)} ({marginPct(tot.soldRevenue,tot.soldCost)}%)</span>
        </span>
      </div>
      {open &&
      <table className="sold-table">
        <thead>
          <tr>
            <th className="l">Category</th>
            <th>Units Sold</th>
            <th>Revenue</th>
            <th>Cost</th>
            <th>Margin</th>
          </tr>
        </thead>
        <tbody>
          {rows.length===0 ? (
            <tr><td className="sold-empty" colSpan={5}>No sales recorded yesterday in the current filter.</td></tr>
          ) : (
            <React.Fragment>
              {rows.map(({category, agg})=>{
                const m = agg.soldRevenue - agg.soldCost;
                return (
                  <tr key={category}>
                    <td className="l">{category}</td>
                    <td>{fmt(agg.out)}</td>
                    <td>{usd(agg.soldRevenue)}</td>
                    <td>{usd(agg.soldCost)}</td>
                    <td className="sold-m">{usd(m)} <span className="cat-sub">{marginPct(agg.soldRevenue,agg.soldCost)}%</span></td>
                  </tr>
                );
              })}
              <tr className="sold-total">
                <td className="l">Total</td>
                <td>{fmt(tot.out)}</td>
                <td>{usd(tot.soldRevenue)}</td>
                <td>{usd(tot.soldCost)}</td>
                <td>{usd(tot.soldRevenue - tot.soldCost)} <span className="cat-sub">{marginPct(tot.soldRevenue,tot.soldCost)}%</span></td>
              </tr>
            </React.Fragment>
          )}
        </tbody>
      </table>
      }
    </div>
  );
}

/* ============================================================
   CATEGORY DRILL-DOWN
   Every subject in a category, at a glance — units, value, margin,
   and yesterday's flow. Replaces the manual click-through count.
   ============================================================ */
/* ============================================================
   HISTORICAL VIEW
   Daily trend lines from data.history. Sold-side backfilled to
   June 1; on-hand value accumulates from July 1, 2026 forward.
   ============================================================ */
function LineChart({ series, height=170 }){
  // series: [{name, color, points:[{x:dateStr, y:number|null}]}] - shared x domain
  const [hover, setHover] = useState(null); // index into allDates
  const W=460, H=height, PAD={t:10,r:12,b:26,l:52};
  const allDates=[...new Set(series.flatMap(s=>s.points.map(p=>p.x)))].sort();
  const vals=series.flatMap(s=>s.points.map(p=>p.y)).filter(v=>v!=null);
  if(allDates.length===0||vals.length===0) return <div className="sold-empty">No data in range yet.</div>;
  const yMax=Math.max(...vals)*1.06||1, yMin=Math.min(0,...vals);
  const plotW=W-PAD.l-PAD.r;
  const xi=(i)=>PAD.l+(allDates.length===1?plotW/2:(i/(allDates.length-1))*plotW);
  const x=(d)=>xi(allDates.indexOf(d));
  const y=(v)=>H-PAD.b-((v-yMin)/(yMax-yMin))*(H-PAD.t-PAD.b);
  const short=(d)=>{const dt=new Date(d+'T12:00:00');return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});};
  const kfmt=(v)=>v>=1000?'$'+Math.round(v/1000)+'K':'$'+Math.round(v);
  const dfmt=(v)=>'$'+Math.round(v).toLocaleString('en-US');
  // x-axis ticks: up to 7 evenly spaced labels, always including first and last
  const nTicks=Math.min(allDates.length,7);
  const tickIdx=[...new Set(nTicks<=1?[0]:Array.from({length:nTicks},(_,k)=>Math.round(k*(allDates.length-1)/(nTicks-1))))];
  const onMove=(e)=>{
    const rect=e.currentTarget.getBoundingClientRect();
    const relX=(e.clientX-rect.left)/rect.width*W;
    const t=allDates.length<2?0:Math.max(0,Math.min(1,(relX-PAD.l)/plotW));
    setHover(Math.round(t*(allDates.length-1)));
  };
  const hoverDate=hover!=null?allDates[hover]:null;
  const hx=hover!=null?xi(hover):null;
  return (
    <div className="hc-wrap">
      <svg viewBox={'0 0 '+W+' '+H} style={{width:'100%',height:'auto',display:'block'}}
           onMouseMove={onMove} onMouseLeave={()=>setHover(null)}>
        {[0,0.5,1].map(f=>{const v=yMin+f*(yMax-yMin);return (
          <g key={f}>
            <line x1={PAD.l} x2={W-PAD.r} y1={y(v)} y2={y(v)} stroke="#E5E7EB" strokeWidth="1"/>
            <text x={PAD.l-6} y={y(v)+3} textAnchor="end" fontSize="9" fill="#9CA3AF" fontFamily="Arial">{kfmt(v)}</text>
          </g>);})}
        {tickIdx.map(i=>(
          <g key={'t'+i}>
            <line x1={xi(i)} x2={xi(i)} y1={H-PAD.b} y2={H-PAD.b+3} stroke="#D1D5DB" strokeWidth="1"/>
            <text x={xi(i)} y={H-PAD.b+13} textAnchor={i===0?'start':(i===allDates.length-1?'end':'middle')} fontSize="9" fill="#9CA3AF" fontFamily="Arial">{short(allDates[i])}</text>
          </g>
        ))}
        {hx!=null && <line x1={hx} x2={hx} y1={PAD.t} y2={H-PAD.b} stroke="#9CA3AF" strokeWidth="1" strokeDasharray="3 3"/>}
        {series.map(s=>{
          const pts=s.points.filter(p=>p.y!=null);
          const dAttr=pts.map((p,i)=>(i===0?'M':'L')+x(p.x).toFixed(1)+' '+y(p.y).toFixed(1)).join(' ');
          return (
            <g key={s.name}>
              {pts.length>1 && <path d={dAttr} fill="none" stroke={s.color} strokeWidth="2"/>}
              {pts.map(p=>(<circle key={p.x} cx={x(p.x)} cy={y(p.y)} r={hoverDate===p.x?3.6:(pts.length>20?1.6:2.6)} fill={s.color}/>))}
            </g>
          );
        })}
      </svg>
      {hoverDate && (()=>{
        const rows=series.map(s=>{const pt=s.points.find(p=>p.x===hoverDate);return pt&&pt.y!=null?{name:s.name,color:s.color,y:pt.y}:null;}).filter(Boolean);
        if(!rows.length) return null;
        const leftPct=(hx/W)*100, flip=leftPct>62;
        return (
          <div className={'hc-tip'+(flip?' flip':'')} style={{left:leftPct+'%'}}>
            <div className="hc-tip-date">{short(hoverDate)}</div>
            {rows.map(r=>(
              <div className="hc-tip-row" key={r.name}>
                <span className="hc-tip-dot" style={{background:r.color}}></span>
                <span className="hc-tip-name">{r.name}</span>
                <span className="hc-tip-val">{dfmt(r.y)}</span>
              </div>
            ))}
          </div>
        );
      })()}
    </div>
  );
}

function HistoricalView({ history, range, custom }){
  const [open, setOpen] = useState(true);
  if(!history || history.length===0) return null;
  const usingCustom = custom.from || custom.to;
  const cut = usingCustom
    ? history.filter(h => (!custom.from || h.date >= custom.from) && (!custom.to || h.date <= custom.to))
    : (range==null ? history : history.slice(-range));
  const sold = [
    { name:'Revenue', color:COLORS.blue, points:cut.map(h=>({x:h.date,y:h.totals.soldRevenue})) },
    { name:'Cost',    color:COLORS.muted, points:cut.map(h=>({x:h.date,y:h.totals.soldCost})) },
    { name:'Margin',  color:COLORS.teal, points:cut.map(h=>({x:h.date,y:(h.totals.soldRevenue||0)-(h.totals.soldCost||0)})) },
  ];
  const onhandCut = cut.filter(h=>h.totals.cost!=null);
  const onhand = [
    { name:'On-Hand Value (Cost)', color:COLORS.black, points:onhandCut.map(h=>({x:h.date,y:h.totals.cost})) },
    { name:'Retail', color:COLORS.blue, points:onhandCut.map(h=>({x:h.date,y:h.totals.retail})) },
  ];
  const totSold = cut.reduce((a,h)=>(a.rev+=h.totals.soldRevenue||0,a.cost+=h.totals.soldCost||0,a),{rev:0,cost:0});
  return (
    <div className="cat-section">
      <div className="cat-collapse-head" onClick={()=>setOpen(o=>!o)}>
        <span className="cat-caret">{open?'▾':'▸'}</span>
        <span className="cat-title">History &amp; Trends</span>
        <span className="cat-desc">{cut.length} {cut.length===1?'day':'days'}</span>
        <span className="cat-head-summary">
          sold {usd(totSold.rev)} rev · {usd(totSold.cost)} cost · <span className="cat-m">{usd(totSold.rev-totSold.cost)} ({marginPct(totSold.rev,totSold.cost)}%)</span>
        </span>
      </div>
      {open && (
        <React.Fragment>
          <div className="hist-charts">
            <div className="hist-chart">
              <h4>Sold per Day</h4>
              <div className="hc-sub">Revenue, cost, and margin on cards sold</div>
              <LineChart series={sold}/>
              <div className="hist-legend">
                <span><span className="dot" style={{background:COLORS.blue}}></span>Revenue</span>
                <span><span className="dot" style={{background:COLORS.muted}}></span>Cost</span>
                <span><span className="dot" style={{background:COLORS.teal}}></span>Margin</span>
              </div>
            </div>
            <div className="hist-chart">
              <h4>On-Hand Value</h4>
              <div className="hc-sub">Inventory value at cost and retail</div>
              <LineChart series={onhand}/>
              <div className="hist-legend">
                <span><span className="dot" style={{background:COLORS.black}}></span>Cost</span>
                <span><span className="dot" style={{background:COLORS.blue}}></span>Retail</span>
              </div>
            </div>
          </div>
          <div className="hist-note">Sold-side history backfilled to June 1, 2026. On-hand values before July 1, 2026 are derived from intake and sales records - graded is near-exact, raw is estimated (restocks and manual adjustments outside product creation are not captured). Recorded snapshots begin July 1, 2026.</div>
        </React.Fragment>
      )}
    </div>
  );
}

      <span className="cat-flow-neg">−{fmt(agg.out)}</span>

function ValueCells({agg}){

function CategoryBreakdown({ records }){
  const [openCats, setOpenCats] = useState({});
  const [openSubs, setOpenSubs] = useState({});
  // group by category -> subject
  const byCat = useMemo(()=>{
    const cats = new Map();
    for(const r of records){
      if(!cats.has(r.category)) cats.set(r.category, new Map());
      const subs = cats.get(r.category);
      if(!subs.has(r.subject)) subs.set(r.subject, []);
      subs.get(r.subject).push(r);
    }
    return cats;
  }, [records]);

  if(byCat.size===0) return null;

  // Other pinned to the bottom; everything else in original order
  const catOrder = [...byCat.keys()].sort((a,b)=>(a==='Other')-(b==='Other'));

  return (
    <React.Fragment>
      {catOrder.map(cat=>{
        const subs = byCat.get(cat);
        const rows = [...subs.entries()].map(([subject, recs])=>({ subject, recs, agg:aggregate(recs) }))
          .filter(r=>r.agg.onhand>0 || r.agg.out>0 || r.agg.in>0)
          .sort((a,b)=> b.agg.retail - a.agg.retail);
        if(rows.length===0) return null;
        const tot = aggregate([...subs.values()].flat());
        const isOpen = !!openCats[cat];
        return (
          <div className="cat-section" key={cat}>
            <div className="cat-collapse-head" onClick={()=>setOpenCats(o=>({...o,[cat]:!o[cat]}))}>
              <span className="cat-caret">{isOpen?'▾':'▸'}</span>
              <span className="cat-title">{cat}</span>
              <span className="cat-desc">{rows.length} {rows.length===1?'category':'categories'}</span>
              <span className="cat-head-summary">
                {fmt(tot.onhand)} u · {usd(tot.cost)} cost · {usd(tot.retail)} retail · <span className="cat-m">{usd(tot.retail-tot.cost)} ({marginPct(tot.retail,tot.cost)}%)</span>
              </span>
            </div>
            {isOpen && (
            <table className="cat-table">
              <thead>
                <tr>
                  <th className="l">Category</th>
                  <th>On Hand</th>
                  <th>Value (Cost)</th>
                  <th>Retail</th>
                  <th>Margin</th>
                  <th>In / Out</th>
                </tr>
              </thead>
              <tbody>
                {rows.map(({subject, recs, agg})=>{
                  const subKey = cat+'|'+subject;
                  const subOpen = !!openSubs[subKey];
                  return (
                    <React.Fragment key={subject}>
                      <tr className="cat-subject-row" onClick={()=>setOpenSubs(o=>({...o,[subKey]:!o[subKey]}))}>
                        <td className="l"><span className="cat-caret sm">{subOpen?'▾':'▸'}</span>{subject}</td>
                        <ValueCells agg={agg}/>
                        <FlowCell agg={agg}/>
                      </tr>
                      {subOpen && ['Graded','Raw'].map(cond=>{
                        const ca = aggregate(recs.filter(r=>r.cond===cond));
                        if(ca.onhand===0 && ca.in===0 && ca.out===0) return null;
                        return (
                          <tr className="cat-cond-row" key={cond}>
                            <td className="l cond">{cond}</td>
                            <ValueCells agg={ca}/>
                            <FlowCell agg={ca}/>
                          </tr>
                        );
                      })}
                    </React.Fragment>
                  );
                })}
                <tr className="cat-total">
                  <td className="l">{cat} total</td>
                  <ValueCells agg={tot}/>
                  <FlowCell agg={tot}/>
                </tr>
              </tbody>
            </table>
            )}
          </div>
        );
      })}
    </React.Fragment>
  );
}

function TrendRange({ range, custom, setRange, setCustom, minDate, maxDate }){

/* ============================================================
   AS-OF REWIND
   Custom range's end date rewinds the dashboard: snapshot days get
   full detail; June days render category-level derived values.
   ============================================================ */
function AsOfBanner({ snap, latestDate }){
  const nice=(d)=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
  let msg;
  if(snap.mode==='snapshot') msg = 'Viewing dashboard as of '+nice(snap.date)+' (recorded snapshot). Tag filters apply.';
  else if(snap.mode==='derived' && snap.entry.totals.cost!=null) msg = 'Viewing '+nice(snap.date)+' - derived values at category level. Graded/Raw split, tier, and tag-filter detail are only available from July 1, 2026 forward.';
  else if(snap.mode==='derived') msg = nice(snap.date)+' selected - derived values for this date land after the next data pull. Showing latest live data below.';
  else msg = 'No data for '+nice(snap.date)+' - showing latest live data ('+nice(latestDate)+').';
  return <div className="asof-banner">{msg}</div>;
}

function RangeSold({ history, from, to }){
  const lo = from || (history[0] && history[0].date) || '';
  const hi = to || (history[history.length-1] && history[history.length-1].date) || '';
  const cut = history.filter(h=>h.date>=lo && h.date<=hi);
  const zero=()=>({out:0,soldCost:0,soldRevenue:0});
  const tot=zero(), byCat={};
  for(const h of cut){
    for(const [c,v] of Object.entries(h.byCategory)){
      const b=(byCat[c]=byCat[c]||zero());
      for(const t of [tot,b]){ t.out+=v.out||0; t.soldCost+=v.soldCost||0; t.soldRevenue+=v.soldRevenue||0; }
    }
  }
  const rows=Object.entries(byCat).map(([category,a])=>({category,a})).filter(r=>r.a.out>0).sort((x,y)=>y.a.soldRevenue-x.a.soldRevenue);
  const nice=(d)=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
  return (
    <div className="sold-section">
      <div className="cat-collapse-head sold" style={{cursor:'default'}}>
        <span className="cat-title">Sold {nice(lo)} - {nice(hi)}</span>
        <span className="cat-desc">{cut.length} days summed</span>
        <span className="cat-head-summary">
          {fmt(tot.out)} units · {usd(tot.soldRevenue)} rev · {usd(tot.soldCost)} cost · <span className="cat-m">{usd(tot.soldRevenue-tot.soldCost)} ({marginPct(tot.soldRevenue,tot.soldCost)}%)</span>
        </span>
      </div>
      <table className="sold-table">
        <thead><tr><th className="l">Category</th><th>Units Sold</th><th>Revenue</th><th>Cost</th><th>Margin</th></tr></thead>
        <tbody>
          {rows.length===0 ? <tr><td className="sold-empty" colSpan={5}>No sales in this range.</td></tr> : (
            <React.Fragment>
              {rows.map(({category,a})=>(
                <tr key={category}>
                  <td className="l">{category}</td><td>{fmt(a.out)}</td><td>{usd(a.soldRevenue)}</td><td>{usd(a.soldCost)}</td>
                  <td className="sold-m">{usd(a.soldRevenue-a.soldCost)} <span className="cat-sub">{marginPct(a.soldRevenue,a.soldCost)}%</span></td>
                </tr>
              ))}
              <tr className="sold-total">
                <td className="l">Total</td><td>{fmt(tot.out)}</td><td>{usd(tot.soldRevenue)}</td><td>{usd(tot.soldCost)}</td>
                <td>{usd(tot.soldRevenue-tot.soldCost)} <span className="cat-sub">{marginPct(tot.soldRevenue,tot.soldCost)}%</span></td>
              </tr>
            </React.Fragment>
          )}
        </tbody>
      </table>
    </div>
  );
}

/* ============================================================
   MONTHLY BUY / SELL + SELL-THROUGH  (Jimmy, Jul 23 2026)
   Bought vs sold vs where we ended, per calendar month. Sell-through
   is sold units over what was available to sell (opening + bought),
   so it stays bounded and reads as "how much of what we could move,
   moved". Expand a month for the category split.
   ============================================================ */
function MonthlyBuySell({ history, from, to }){
  const [open, setOpen] = useState({});
  const lo = from || (history[0] && history[0].date) || '';
  const hi = to || (history[history.length-1] && history[history.length-1].date) || '';
  const months = useMemo(()=>{
    const cut = history.filter(h=>h.date>=lo && h.date<=hi);
    const byMonth = {};
    for(const h of cut){
      const k = h.date.slice(0,7);
      const m = (byMonth[k] = byMonth[k] || {
        key:k, days:0, firstDate:h.date, lastDate:h.date,
        inU:0, inCost:0, outU:0, soldRev:0, soldCost:0,
        endOnhand:null, endCost:null, openOnhand:null, cats:{},
      });
      m.days++;
      if(h.date < m.firstDate) m.firstDate = h.date;
      if(h.date >= m.lastDate){ m.lastDate = h.date; m.endOnhand = h.totals.onhand; m.endCost = h.totals.cost; }
      m.inU += h.totals.in||0; m.inCost += h.totals.inCost||0;
      if(h.soldUnavailable || h.totals.out==null) m.soldDaysMissing = (m.soldDaysMissing||0)+1;
      else { m.soldDays = (m.soldDays||0)+1;
        m.outU += h.totals.out||0;
        m.soldRev += h.totals.soldRevenue||0; m.soldCost += h.totals.soldCost||0; }
      for(const [c,v] of Object.entries(h.byCategory||{})){
        const cb = (m.cats[c] = m.cats[c] || { inU:0, inCost:0, outU:0, soldRev:0, soldCost:0, endOnhand:null });
        cb.inU += v.in||0; cb.inCost += v.inCost||0; cb.outU += v.out||0;
        cb.soldRev += v.soldRevenue||0; cb.soldCost += v.soldCost||0;
        if(h.date === m.lastDate) cb.endOnhand = v.onhand;
      }
    }
    // Opening position = closing position of the day before the month's first day.
    const byDate = {}; for(const h of history) byDate[h.date] = h;
    const list = Object.values(byMonth).sort((a,b)=>a.key.localeCompare(b.key));
    for(const m of list){
      const prev = new Date(m.firstDate+'T12:00:00'); prev.setDate(prev.getDate()-1);
      const pk = prev.toISOString().slice(0,10);
      m.openOnhand = byDate[pk] ? byDate[pk].totals.onhand : null;
    }
    return list;
  }, [history, lo, hi]);

  if(months.length===0) return null;
  const monthName = (k)=>new Date(k+'-15T12:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'});
  // Available to sell = opening on-hand + bought. Null opening (no prior day in
  // history) falls back to bought only, and the month is marked partial.
  const sellThrough = (m)=>{
    const avail = (m.openOnhand==null ? 0 : m.openOnhand) + m.inU;
    return avail>0 ? Math.round(m.outU/avail*1000)/10 : 0;
  };
  const grand = months.reduce((a,m)=>({
    inU:a.inU+m.inU, inCost:a.inCost+m.inCost, outU:a.outU+m.outU,
    soldRev:a.soldRev+m.soldRev, soldCost:a.soldCost+m.soldCost,
  }), {inU:0,inCost:0,outU:0,soldRev:0,soldCost:0});
  const last = months[months.length-1];

  return (
    <div className="sold-section">
      <div className="cat-collapse-head sold" style={{cursor:'default'}}>
        <span className="cat-title">Buy vs Sell by Month</span>
        <span className="cat-desc">{months.length} month{months.length===1?'':'s'} · bought, sold, and where we ended</span>
        <span className="cat-head-summary">
          Bought {fmt(grand.inU)} u · {usd(grand.inCost)} &nbsp;|&nbsp; Sold {fmt(grand.outU)} u · <span className="cat-m">{usd(grand.soldRev)}</span>
        </span>
      </div>
      <table className="sold-table">
        <thead><tr>
          <th className="l">Month</th><th>Bought (u)</th><th>Buy Cost</th>
          <th>Sold (u)</th><th>Sell Revenue</th><th>Margin</th>
          <th>Sell-Through</th><th>Ending On Hand</th>
        </tr></thead>
        <tbody>
          {months.map(m=>{
            const isOpen = !!open[m.key];
            const partial = m.openOnhand==null;
            const noSold = !m.soldDays;
            const cats = Object.entries(m.cats).filter(([,v])=>v.inU>0||v.outU>0)
              .sort((a,b)=>b[1].soldRev-a[1].soldRev);
            return (
              <React.Fragment key={m.key}>
                <tr onClick={()=>setOpen(o=>({...o,[m.key]:!o[m.key]}))} style={{cursor:'pointer'}}>
                  <td className="l">{monthName(m.key)} <span className="cat-sub">{isOpen?'▾':'▸'} {m.days}d</span></td>
                  <td>{fmt(m.inU)}</td>
                  <td>{usd(m.inCost)}</td>
                  {noSold ? (
                    <React.Fragment>
                      <td className="cat-sub" colSpan={3} title="Shopify's orders API only exposes about 60 days, so sales for this month cannot be retrieved">Sales data not retrievable</td>
                      <td className="cat-sub">—</td>
                    </React.Fragment>
                  ) : (
                    <React.Fragment>
                      <td>{fmt(m.outU)}{m.soldDaysMissing>0 && <span className="cat-sub"> *</span>}</td>
                      <td>{usd(m.soldRev)}</td>
                      <td className="sold-m">{usd(m.soldRev-m.soldCost)} <span className="cat-sub">{marginPct(m.soldRev,m.soldCost)}%</span></td>
                      {m.soldDaysMissing>0
                        ? <td className="cat-sub" title="Sales are missing for part of this month, so sell-through would compare a partial numerator against a full month of buying">n/a</td>
                        : <td>{sellThrough(m)}%{partial && <span className="cat-sub" title="No prior-day position in history, so sell-through uses bought only"> *</span>}</td>}
                    </React.Fragment>
                  )}
                  <td>{m.endOnhand==null?'—':fmt(m.endOnhand)}</td>
                </tr>
                {isOpen && cats.map(([c,v])=>(
                  <tr key={m.key+c} className="sub-row">
                    <td className="l" style={{paddingLeft:'26px'}}>{c}</td>
                    <td>{fmt(v.inU)}</td><td>{usd(v.inCost)}</td>
                    <td>{fmt(v.outU)}</td><td>{usd(v.soldRev)}</td>
                    <td className="sold-m">{usd(v.soldRev-v.soldCost)} <span className="cat-sub">{marginPct(v.soldRev,v.soldCost)}%</span></td>
                    <td className="cat-sub">—</td>
                    <td>{v.endOnhand==null?'—':fmt(v.endOnhand)}</td>
                  </tr>
                ))}
              </React.Fragment>
            );
          })}
          <tr className="sold-total">
            <td className="l">Total</td>
            <td>{fmt(grand.inU)}</td><td>{usd(grand.inCost)}</td>
            <td>{fmt(grand.outU)}</td><td>{usd(grand.soldRev)}</td>
            <td>{usd(grand.soldRev-grand.soldCost)} <span className="cat-sub">{marginPct(grand.soldRev,grand.soldCost)}%</span></td>
            <td className="cat-sub">—</td>
            <td>{last.endOnhand==null?'—':fmt(last.endOnhand)}</td>
          </tr>
        </tbody>
      </table>
      <div className="footnote" style={{padding:'8px 2px 0'}}>
        Sell-through = units sold ÷ (opening on hand + units bought). Buy cost is the cost basis of singles received that month. Click a month for the category split. Months marked “Sales data not retrievable” predate Shopify’s ~60-day orders window - buy figures for those months are complete, sales cannot be recovered without expanded API access. An asterisk marks a partial month.
      </div>
    </div>
  );
}

function DerivedAsOf({ entry }){
  const rows=Object.entries(entry.byCategory).map(([category,v])=>({category,v}))
    .filter(r=>r.v.cost!=null && (r.v.onhand>0||r.v.cost>0))
    .sort((x,y)=>(y.v.retail||0)-(x.v.retail||0));
  if(rows.length===0) return null;
  const t=entry.totals;
  return (
    <div className="cat-section">
      <div className="cat-collapse-head" style={{cursor:'default'}}>
        <span className="cat-title">On Hand by Category</span>
        <span className="cat-desc">derived for this date</span>
      </div>
      <table className="cat-table">
        <thead><tr><th className="l">Category</th><th>On Hand</th><th>Value (Cost)</th><th>Retail</th><th>Margin</th></tr></thead>
        <tbody>
          {rows.map(({category,v})=>(
            <tr key={category}>
              <td className="l">{category}</td><td>{fmt(v.onhand)}</td><td>{usd(v.cost)}</td><td>{usd(v.retail)}</td>
              <td className="cat-m">{usd((v.retail||0)-(v.cost||0))} <span className="cat-sub">{marginPct(v.retail,v.cost)}%</span></td>
            </tr>
          ))}
          <tr className="cat-total">
            <td className="l">Total</td><td>{fmt(t.onhand)}</td><td>{usd(t.cost)}</td><td>{usd(t.retail)}</td>
            <td>{usd((t.retail||0)-(t.cost||0))} <span className="cat-sub">{marginPct(t.retail,t.cost)}%</span></td>
          </tr>
        </tbody>
      </table>
    </div>
  );
}

function App(){
  const [selected, setSelected] = useState(()=>new Set());
  const [data, setData] = useState(null);
  const [histRange, setHistRange] = useState(1); // 1=Yesterday (default view), 7/14/30, null=All
  const [histCustom, setHistCustom] = useState({ from:'', to:'' });

  React.useEffect(()=>{
    fetch('./data.json', { cache:'no-store' })
      .then(r=>{ if(!r.ok) throw new Error('no data.json'); return r.json(); })
      .then(d=>{
        const dt = new Date((d.date||'') + 'T12:00:00');
        const dateLabel = isNaN(dt) ? SNAPSHOT.range
          : dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
        const stampLabel = d.generatedAt
          ? ('As of ' + new Date(d.generatedAt).toLocaleString('en-US',{hour:'numeric',minute:'2-digit'}) + ' ET · yesterday')
          : SNAPSHOT.stamp;
        setData({ records:d.records||[], history:d.history||[], snapshots:d.snapshots||[], date:d.date||'', isSample:!!d.isSample, dateLabel, stampLabel });
      })
      .catch(()=> setData({ records:SAMPLE_RECORDS, history:[], snapshots:[], date:'', isSample:true, dateLabel:SNAPSHOT.range, stampLabel:SNAPSHOT.stamp }));
  }, []);

  const records = data ? data.records : null;

  // ---- As-of resolver: custom range's end date rewinds the whole dashboard ----
  const customActive = !!(histCustom.from || histCustom.to);
  const latestDate = data ? data.date : '';
  // Effective range: presets are shorthand for a window ending at the latest date,
  // so 7D/30D/All drive the sold side exactly like a custom range does.
  const histMinD = data && data.history && data.history.length ? data.history[0].date : '';
  const histMaxD = data && data.history && data.history.length ? data.history[data.history.length-1].date : '';
  const addDays = (d,n)=>{ const x=new Date(d+'T12:00:00'); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); };
  // Calendar-month presets resolve against the latest data date, then clamp to
  // available history so a partial first month never reads as a full one.
  const monthBounds = (endDate, back)=>{
    if(!endDate) return ['',''];
    const d = new Date(endDate+'T12:00:00');
    const first = new Date(d.getFullYear(), d.getMonth()-back, 1);
    const last  = new Date(d.getFullYear(), d.getMonth()-back+1, 0);
    const iso = (x)=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
    return [iso(first), back===0 ? endDate : iso(last)];
  };
  let presetFrom, presetTo = histMaxD;
  if(histRange==='mtd')        [presetFrom, presetTo] = monthBounds(histMaxD, 0);
  else if(histRange==='lastmo')[presetFrom, presetTo] = monthBounds(histMaxD, 1);
  else if(histRange)            presetFrom = histMaxD ? addDays(histMaxD, -(histRange-1)) : '';
  else                          presetFrom = histMinD;
  const clampLo = (d)=> (histMinD && d && d < histMinD) ? histMinD : d;
  const effFrom = customActive ? (histCustom.from || histMinD) : clampLo(presetFrom);
  const effTo = customActive ? (histCustom.to || histMaxD) : presetTo;
  const rangeActive = customActive || histRange !== 1;
  // Monthly buy/sell table shows whenever a month preset or a multi-month span is picked.
  const monthlyView = histRange==='mtd' || histRange==='lastmo' || histRange===null || customActive;
  // On-hand is a point-in-time measure, so it always reads as of the range's end date.
  // "Last month" therefore rewinds the tiles to that month's close; MTD stays live.
  const asOf = effTo || latestDate;
  const [snap, setSnap] = useState(null); // {mode:'snapshot'|'derived'|'missing', date, records?, entry?}
  React.useEffect(()=>{
    if(!data || !asOf || asOf===latestDate){ setSnap(null); return; }
    if(data.snapshots.includes(asOf)){
      let live=true;
      fetch('./snapshots/'+asOf+'.json', { cache:'no-store' })
        .then(r=>{ if(!r.ok) throw new Error('missing'); return r.json(); })
        .then(s=>{ if(live) setSnap({ mode:'snapshot', date:asOf, records:s.records||[] }); })
        .catch(()=>{ if(live){ const e=data.history.find(h=>h.date===asOf); setSnap(e?{mode:'derived',date:asOf,entry:e}:{mode:'missing',date:asOf}); } });
      return ()=>{ live=false; };
    }
    const e = data.history.find(h=>h.date===asOf);
    setSnap(e ? { mode:'derived', date:asOf, entry:e } : { mode:'missing', date:asOf });
  }, [data, asOf, latestDate]);

  const derivedMode = snap && snap.mode==='derived';
  const derivedReady = derivedMode && snap.entry.totals.cost!=null;
  const viewRecords = snap && snap.mode==='snapshot' ? snap.records : records;
  const filtered = useMemo(()=> viewRecords ? viewRecords.filter(r=>matches(r, selected)) : [], [viewRecords, selected]);
  const liveTotals = useMemo(()=>aggregate(filtered), [filtered]);
  const totals = derivedReady ? snap.entry.totals : liveTotals;

  if(!data) return <div style={{padding:'60px 20px', textAlign:'center', color:'#6B7280', fontFamily:'Arial'}}>Loading inventory…</div>;

  const histMin = data.history && data.history.length ? data.history[0].date : '';
  const histMax = data.history && data.history.length ? data.history[data.history.length-1].date : '';

  return (
    <React.Fragment>
      <Banner isSample={data.isSample} dateLabel={data.dateLabel} stampLabel={data.stampLabel}/>
      <div className="overview-head">
        <div className="oh-left">
          <h2 className="oh-title">Today's Snapshot</h2>
          <InfoButton/>
        </div>
        <FilterBar selected={selected} setSelected={setSelected}/>
      </div>
      {histMax && <TrendRange range={histRange} custom={histCustom} setRange={setHistRange} setCustom={setHistCustom} minDate={histMin} maxDate={histMax}/>}
      {snap && <AsOfBanner snap={snap} latestDate={latestDate}/>}
      <Totals totals={totals}/>
      {rangeActive
        ? <RangeSold history={data.history} from={effFrom} to={effTo}/>
        : <SoldSide records={filtered}/>}
      {monthlyView && <MonthlyBuySell history={data.history} from={effFrom} to={effTo}/>}
      {derivedReady
        ? <DerivedAsOf entry={snap.entry}/>
        : <React.Fragment>
            <GradedRollup records={filtered}/>
            <ActiveFilters selected={selected} setSelected={setSelected}/>
            <CategoryBreakdown records={filtered}/>
          </React.Fragment>}
      <HistoricalView history={data.history} range={histRange} custom={histCustom}/>
      <div className="footnote">
        {data.isSample
          ? 'Showing sample data — figures are illustrative, not yet pulled from live systems.'
          : 'Cards only · all channels (online + POS) · refreshed daily at 8:00 AM ET.'}
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
