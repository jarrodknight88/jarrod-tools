<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Command Center</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*__CSS__*/
</style>
</head>
<body data-boot data-tab="today" data-cal="day" data-page="home">
<div class="boot" id="boot"><div><b>Command Center</b><span id="bootMsg">Loading your day</span></div></div>

<div class="app">
  <header class="mtop">
    <div><div class="hello" id="hello"></div><div class="sub" id="helloSub"></div></div>
    <div class="mtop-right">
      <button class="bell" data-act="search" aria-label="Search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
      <button class="bell" data-act="bell" aria-label="Notifications"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="badge" data-badge hidden></span></button>
      <button class="avatar" data-act="page" data-v="settings" aria-label="Settings">JK</button>
    </div>
  </header>

  <aside class="side">
    <div class="brand-row"><div class="brand">Command Center</div><button class="bell" data-act="bell" aria-label="Notifications"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="badge" data-badge hidden></span></button></div>
    <button class="newbtn" data-act="new">New task <kbd>N</kbd></button>
    <button class="searchbtn" data-act="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Search <kbd>/</kbd></button>
    <div class="seg" role="group" aria-label="Whose items" data-who></div>
    <div id="tree"></div>
    <div class="sidenav"><button data-act="page" data-v="meetings" id="navMeet">Meetings</button><button data-act="page" data-v="settings" id="navSet">Settings</button></div>
    <div class="side-foot">Drag a task onto the board or the calendar.</div>
  </aside>

  <main class="main">
    <div class="seg mwho" role="group" aria-label="Whose items" data-who></div>
    <div id="home">
      <section class="brief" id="brief" data-open="false" aria-label="Daily briefing">
        <div class="brief-top">
          <span class="date" id="briefDate"></span>
          <span style="display:flex;align-items:center"><span class="auto" id="briefAuto"></span>
          <span class="mode" role="group" aria-label="Briefing"><button data-act="mode" data-v="am">Morning</button><button data-act="mode" data-v="pm">Evening</button></span></span>
        </div>
        <h1 class="headline" id="headline"></h1>
        <div class="brief-cols" id="briefCols"></div>
        <p class="brief-note" id="briefNote"></p>
        <button class="brief-more" data-act="brief" id="briefMore" style="margin-top:12px">Show details</button>
      </section>
      <div class="viewbar"><div class="seg" id="tabs" role="group" aria-label="View"></div><span class="hint" id="viewHint"></span></div>
      <div id="view"></div>
    </div>
    <div id="page"></div>
  </main>

  <aside class="cal">
    <div class="cal-head"><h2>Calendar</h2><div class="seg" role="group" aria-label="Calendar range"><button data-act="calmode" data-v="day">Day</button><button data-act="calmode" data-v="week">Week</button></div></div>
    <div class="cal-nav"><b id="calLabel"></b><button class="nav" data-act="calnav" data-v="-1" aria-label="Earlier">&lsaquo;</button><button class="nav" data-act="calnav" data-v="0">Today</button><button class="nav" data-act="calnav" data-v="1" aria-label="Later">&rsaquo;</button></div>
    <div class="legend" id="legend"></div>
    <div class="calwrap" id="cal"></div>
  </aside>
</div>

<nav class="tabbar" aria-label="Sections">
  <button data-act="tab" data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 10h8M8 14h5"/></svg>Today</button>
  <button data-act="tab" data-v="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
  <button data-act="tab" data-v="projects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Projects</button>
  <button data-act="tab" data-v="meetings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="9" r="3.2"/><path d="M3 19c.6-3 3-4.5 6-4.5s5.4 1.5 6 4.5M16 6.200a3 3 0 0 1 0 5.600M18 14.800c1.700.600 2.700 2 3 4.200"/></svg>Meetings</button>
</nav>
<button class="fab" data-act="new" aria-label="New task">+</button>

<div class="scrim" id="scrim" data-act="close"></div>
<section class="notif" id="notif" aria-label="Notifications">
  <div class="notif-head"><h2>Notifications</h2><button class="linkbtn" data-act="markread">Mark all read</button></div>
  <div id="notifList"></div>
</section>

<section class="detail" id="detail" aria-label="Task details">
  <div class="d-top"><span class="crumb" id="dCrumb"></span><button class="xbtn" data-act="close" aria-label="Close">&times;</button></div>
  <div class="d-body" id="dBody"></div>
  <div class="composer">
    <textarea id="dInput" rows="2" placeholder="Add a comment"></textarea>
    <div class="pending" id="dPending"></div>
    <div class="c-row">
      <button class="ibtn" data-act="attach" data-v="comment"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l9.2-9.2a3.7 3.7 0 0 1 5.2 5.2l-9.2 9.2a1.8 1.8 0 0 1-2.6-2.6l8.5-8.5"/></svg>Attach</button>
      <button class="ibtn" data-act="mention" id="mentionBtn" hidden>@Claude</button>
      <button class="send" data-act="comment" id="commentBtn">Comment</button>
    </div>
  </div>
</section>

<section class="detail info" id="info" aria-label="Details">
  <div class="d-top"><span class="crumb" id="iCrumb"></span><button class="xbtn" data-act="close" aria-label="Close">&times;</button></div>
  <div class="d-body" id="iBody"></div>
</section>

<section class="qa" id="qa" aria-label="New task">
  <h2>New task</h2>
  <input id="qTitle" placeholder="What needs doing?" autocomplete="off">
  <div class="qrow"><span>Area</span><div class="chips" id="qArea"></div></div>
  <div class="qrow"><span>Project</span><div><select id="qProj" aria-label="Project"></select></div></div>
  <div class="qrow"><span>Due</span><div class="chips" id="qDue"></div></div>
  <div class="qrow"><span>For</span><div class="chips" id="qWho"></div></div>
  <label class="ck"><input type="checkbox" id="qBoard" checked> Put it on today's board</label>
  <div class="qfoot"><button class="ghost" data-act="close">Cancel</button><button class="send" data-act="qadd">Add task</button></div>
</section>

<section class="qa search" id="search" aria-label="Search">
  <input id="sInput" placeholder="Search tasks, meetings and projects" autocomplete="off">
  <div id="sResults"></div>
</section>

<section class="qa fp" id="fp" aria-label="Choose a folder">
  <h2>Choose a Drive folder</h2>
  <p id="fpNote">Recaps for this meeting will be filed here.</p>
  <div id="fpTree"></div>
  <div class="qfoot"><button class="ghost" data-act="fpclose">Cancel</button></div>
</section>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo" hidden>Undo</button></div>
<div class="saving" id="saving">Saving</div>
<input type="file" id="fileInput" multiple hidden>

<script>
/*__JS__*/
</script>
</body>
</html>
