<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command Center - Sign in</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#F6F7F9;color:#111111;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
main{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
form{width:100%;max-width:340px;background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px rgba(17,17,17,0.03)}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:26px;height:26px;border-radius:7px;background:#111111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
h1{margin:0;font-size:15px;font-weight:600;letter-spacing:-0.01em}
p{margin:0;font-size:12px;color:#6B7280}
input{height:38px;padding:0 12px;border:1px solid #E5E7EB;border-radius:8px;font:inherit;font-size:14px;outline:none}
input:focus{border-color:#3B82F6;box-shadow:0 0 0 3px rgba(59,130,246,0.15)}
button{height:38px;border:0;border-radius:8px;background:#111111;color:#fff;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
button:hover{background:#000}
button:disabled{opacity:.6;cursor:default}
.err{min-height:16px;font-size:12px;color:#B91C1C}
</style>
</head>
<body>
<main>
  <form id="f">
    <div class="brand"><div class="mark">HQ</div><div><h1>Command Center</h1><p>Sign in to continue</p></div></div>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus required>
    <div class="err" id="err"></div>
    <button id="btn" type="submit">Sign in</button>
  </form>
</main>
<script>
const f = document.getElementById('f'), pw = document.getElementById('pw'), err = document.getElementById('err'), btn = document.getElementById('btn');
f.addEventListener('submit', async e => {
  e.preventDefault(); err.textContent = ''; btn.disabled = true;
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: pw.value }) });
    if (r.ok) { location.href = '/'; return; }
    err.textContent = (await r.json().catch(() => ({}))).error || 'Could not sign in';
  } catch { err.textContent = 'Network error - try again'; }
  btn.disabled = false;
});
</script>
</body>
</html>
